name: Release

# Lives at the repo root so GitHub Actions discovers it. The Tauri app is in the
# cortex-speech-app/ subdirectory, so the matrix job sets
# defaults.run.working-directory: cortex-speech-app for its shell steps. The
# setup-node cache-dependency-path and the artifact/release globs are resolved
# relative to the workspace (they do NOT honor that default), so they carry
# explicit cortex-speech-app/ prefixes.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: cortex-speech-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex-speech-app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - if: startsWith(matrix.os, 'macos')
        run: brew install gtk+3
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked
      - run: npm ci
      - if: startsWith(matrix.os, 'ubuntu')
        run: npx playwright install --with-deps chromium
      - if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: npx playwright install chromium
      # Base models AND a built dist/ must exist BEFORE any cargo step: build.rs -> tauri-build
      # validates bundle.resources (models/silero_vad_v4.onnx, ...) and tauri::generate_context!
      # (compiled by clippy and cargo test below) requires build.frontendDist ("../dist"). This is
      # the same provisioning ci.yml uses - without it the tag gate failed by construction (the
      # 2026-07-09 nightly red was exactly this class; true-10 audit).
      - name: Fetch + verify models (bundle.resources)
        run: npm run fetch-models
      - name: Build frontend (generate_context needs ../dist)
        run: npm run build
      # Governance gate (verify_10.py): manifest/version alignment, ledger schema, and the
      # license-compatibility check. Tags can be cut from ANY commit, so the release path must run
      # it itself rather than assume ci.yml did (true-10 audit).
      - name: Governance gate
        run: python "${{ github.workspace }}/scripts/verify_10.py" --static
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python-policies
      - run: npm run lint
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm ls --all
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: Build Tauri app
        run: npm run tauri build
      - name: Code-sign and verify Windows installers (Authenticode)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            throw "Public releases require WINDOWS_CERT_BASE64 and WINDOWS_CERT_PASSWORD; refusing to publish unsigned Windows installers."
          }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
            if (-not $st) { throw "signtool.exe was not found" }
            $installers = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Include *.msi,*-setup.exe)
            if ($installers.Count -eq 0) { throw "Tauri produced no Windows installers to sign" }
            foreach ($f in $installers) {
              & $st sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing failed for $($f.Name)" }
              & $st verify /pa $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "verify failed for $($f.Name)" }
              Write-Output "signed + verified: $($f.Name)"
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      # SBOM before checksums and attestation, so it is itself covered by both. Generated from the
      # LOCKFILES (package-lock.json + Cargo.lock), not the installed node_modules: `npm sbom` refuses
      # on this project because a clean `npm ci` yields a tree npm itself calls invalid. See the
      # module docstring in generate_sbom.py.
      - name: Generate CycloneDX SBOM
        if: runner.os == 'Windows'
        run: python scripts/generate_sbom.py --output src-tauri/target/release/bundle/cortex-speech.cdx.json
      - name: Generate release checksums
        if: runner.os == 'Windows'
        run: python scripts/generate_release_checksums.py src-tauri/target/release/bundle --output SHA256SUMS-${{ matrix.os }}
      - name: Attest release artifacts
        if: runner.os == 'Windows'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: cortex-speech-app/src-tauri/target/release/bundle/**/*
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-speech-${{ matrix.os }}
          path: cortex-speech-app/src-tauri/target/release/bundle/**

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download attested platform bundles
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: cortex-speech-windows-latest
          path: release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/**
          generate_release_notes: true
