name: Nightly Real Audio

# Lives at the repo root so GitHub Actions discovers it. The Tauri app is in the
# cortex-speech-app/ subdirectory, so the job sets
# defaults.run.working-directory: cortex-speech-app for its shell steps and the
# actions/cache inputs (which do NOT honor that default) use explicit
# cortex-speech-app/ prefixes.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      real_audio_dir:
        description: 'Path to folder with Kurdish MP4/WAV fixtures'
        required: false
        type: string

concurrency:
  group: nightly-real-audio
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  real-audio:
    name: Real audio + ASR (optional fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: cortex-speech-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      # Same toolchain action as ci.yml / release.yml - one action across all workflows so a
      # nightly-only failure can never be an artifact of a different installer. The version
      # itself comes from //rust-toolchain.toml, which rustup honors automatically.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cortex-speech-app/src-tauri/target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('cortex-speech-app/src-tauri/Cargo.lock') }}

      # Base models AND a built dist/ must exist before ANY cargo build in this job: build.rs ->
      # tauri-build validates bundle.resources (models/silero_vad_v4.onnx) and the crate's
      # tauri::generate_context! (compiled by the test binaries) requires build.frontendDist
      # ("../dist"). Same provisioning ci.yml uses (fixes the nightly "resource path
      # models/silero_vad_v4.onnx doesn't exist" failure - and the dist/ failure right behind it).
      - name: Fetch + verify base models (bundle.resources)
        run: npm run fetch-models
      - name: Install Node dependencies (for the frontend build below)
        run: npm ci
      - name: Build frontend (tauri generate_context needs ../dist)
        run: npm run build

      - name: Run ignored real-audio tests when fixtures available
        env:
          CORTEX_REAL_AUDIO_DIR: ${{ github.event.inputs.real_audio_dir || vars.CORTEX_REAL_AUDIO_DIR || '' }}
        run: |
          if [ -z "$CORTEX_REAL_AUDIO_DIR" ] || [ ! -d "$CORTEX_REAL_AUDIO_DIR" ]; then
            # Honest signal: a SKIP is not a PASS. Emit a visible warning annotation so a green
            # nightly is never mistaken for "the real OmniASR pipeline was exercised".
            echo "::warning title=Real-audio suite skipped::No CORTEX_REAL_AUDIO_DIR fixture provided - the real OmniASR pipeline was NOT exercised. A green run here does NOT mean real-audio passed. Run npm run test:e2e:real or set CORTEX_REAL_AUDIO_DIR on a runner with the ONNX models."
            exit 0
          fi
          cd src-tauri
          cargo test --test real_audio -- --ignored --nocapture

      - name: Soak import stability
        run: cargo test --test soak -- --nocapture
        working-directory: cortex-speech-app/src-tauri

      - name: Fine-tuned accuracy regression gate (when gold + model provided)
        working-directory: cortex-speech-app
        env:
          CORTEX_FINETUNED_GOLD: ${{ vars.CORTEX_FINETUNED_GOLD || '' }}
          CORTEX_FINETUNED_MODEL: ${{ vars.CORTEX_FINETUNED_MODEL || '' }}
          CORTEX_FINETUNED_ONNX: ${{ vars.CORTEX_FINETUNED_ONNX || '' }}
          CORTEX_SCORECARD_BASELINE: docs/finetuned_scorecard_baseline.json
        run: |
          if [ -z "$CORTEX_FINETUNED_GOLD" ] || [ ! -f "$CORTEX_FINETUNED_GOLD" ] || [ -z "$CORTEX_FINETUNED_ONNX" ]; then
            echo "::warning title=Fine-tuned accuracy gate skipped::No CORTEX_FINETUNED_GOLD/ONNX provided - the fine-tuned CER regression gate did NOT run. A green run here does NOT mean accuracy held. Provide the gold manifest + model.onnx to enforce 21.00% +/- band (docs/finetuned_scorecard_baseline.json)."
            exit 0
          fi
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers soundfile jiwer onnxruntime numpy
          # Exits non-zero if micro CER exceeds the committed baseline ci_hi by > the noise margin.
          python scripts/scorecard_finetuned.py "$CORTEX_FINETUNED_GOLD" 3000

  # ---------------------------------------------------------------------------------------
  # Fuzz campaign - the charter's "every fuzz target, 0 unresolved crashes". Enumerated at runtime by
  # `cargo fuzz list`; the step below fails loud on an empty list so the campaign cannot pass vacuously.
  #
  # This job is the ONLY place the leg can run. On the owner's windows-msvc rig cargo-fuzz
  # cannot link at all (measured 2026-07-11: ASAN's dynamic-CRT model multiply-defines std::
  # symbols against the static-MT sherpa-onnx prebuilt, LNK2005; --sanitizer none then strips
  # the runtime providing libFuzzer's sancov symbols, LNK2001). verify_10.py honestly reports
  # SKIP-ENV there and will keep doing so - this job, not a loosened local gate, is the evidence.
  # ---------------------------------------------------------------------------------------
  fuzz:
    name: Fuzz campaign (5 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      # cargo-fuzz requires nightly (-Z build-std / sanitizer flags), so this job deliberately
      # departs from //rust-toolchain.toml. That pin governs the measurement-bearing builds;
      # fuzzing only needs to crash or not crash, so toolchain drift here cannot move a number.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - name: Cache cargo + fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The corpus is cached so coverage ACCUMULATES across nights rather than each run
          # restarting from zero - a fresh-corpus fuzzer re-derives trivial inputs every time
          # and never reaches the deep paths where real bugs live.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cortex-speech-app/src-tauri/fuzz/corpus
          key: ${{ runner.os }}-fuzz-${{ hashFiles('cortex-speech-app/src-tauri/Cargo.lock') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ hashFiles('cortex-speech-app/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build.rs -> tauri-build validates bundle.resources, and tauri::generate_context!
      # requires build.frontendDist - the fuzz crate links the lib, so it needs both.
      - name: Provision models + dist (build.rs prerequisites)
        working-directory: cortex-speech-app
        run: |
          npm run fetch-models
          npm ci
          npm run build

      - name: Fuzz each target (15 min, charter campaign length)
        working-directory: cortex-speech-app/src-tauri
        run: |
          set -o pipefail
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "::error title=No fuzz targets::cargo fuzz list returned nothing - the campaign would pass vacuously."
            exit 1
          fi
          echo "Targets: $targets"
          failed=0
          for t in $targets; do
            echo "::group::fuzz $t"
            if ! cargo +nightly fuzz run "$t" -- -max_total_time=900 -print_final_stats=1; then
              echo "::error title=Fuzz crash in $t::cargo fuzz run $t found a crash. Artifact uploaded."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: cortex-speech-app/src-tauri/fuzz/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # Mutation testing - the charter's "0 surviving mutants in irt/conformal/ood/diff/normalizer",
  # run --in-diff as the charter specifies (a full sweep is 844 mutants ~= a day; the changed
  # lines are where regressions actually enter).
  #
  # Motivating incident: the 2026-07-25 IRT raw-sum-gradient bug passed all 1,015 unit tests
  # because they asserted shapes rather than values. This is the gate that would have caught it.
  # ---------------------------------------------------------------------------------------
  mutants:
    name: Mutation gate (core modules, --in-diff)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # --in-diff needs real history to compute the day's diff

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cortex-speech-app/src-tauri/target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('cortex-speech-app/src-tauri/Cargo.lock') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Provision models + dist (build.rs prerequisites)
        working-directory: cortex-speech-app
        run: |
          npm run fetch-models
          npm ci
          npm run build

      - name: Mutate the last day's changes to the core modules
        working-directory: cortex-speech-app/src-tauri
        run: |
          set -o pipefail
          BASE=$(git log --since='24 hours ago' --format=%H | tail -1)
          if [ -z "$BASE" ]; then
            # Honest signal: no commits means nothing to mutate, NOT a passed gate.
            echo "::warning title=Mutation gate idle::No commits in the last 24h - no diff to mutate. This is not a pass."
            exit 0
          fi
          # --relative is REQUIRED. Without it git writes repo-root-relative paths
          # (b/cortex-speech-app/src-tauri/src/...) while cargo-mutants runs from src-tauri and
          # matches package-relative ones, so every hunk is rejected with
          # "Diff content doesn't match source file". Verified locally against a real commit range
          # before this job ever ran on a runner.
          # This list MUST stay in step with examine_globs in .cargo/mutants.toml. It did not:
          # src/couch.rs was added to examine_globs on 2026-07-27 with a comment calling it the
          # highest-risk module in the scope ("it decides which reviewer holds which clip ... a
          # flipped comparison there loses a human's work rather than a number"), and this filter
          # never got it. --in-diff then drops every couch mutant, so the one module singled out as
          # most dangerous was the one module this job could not mutate. Found 2026-08-03.
          git diff --relative "$BASE^" HEAD -- src/couch.rs src/quality/irt.rs src/quality/conformal.rs \
            src/quality/signal_anomaly.rs 'src/diff/*' src/normalizer.rs 'src/normalizer/*' \
            > /tmp/core.diff || true
          if [ ! -s /tmp/core.diff ]; then
            echo "::notice title=Mutation gate idle::No core-module changes in the last 24h."
            exit 0
          fi
          # examine_globs / --lib scoping / timeouts all come from src-tauri/.cargo/mutants.toml
          # (verified read: `cargo mutants --list` enumerates exactly the eight scoped files).
          #
          # --in-place is REQUIRED, for exactly the reason the Makefile's `mutants` target already
          # documents: cargo-mutants copies the PACKAGE to $TMPDIR and builds there, so
          # tauri.conf.json's frontendDist "../dist" resolves to /tmp/dist and
          # tauri::generate_context! panics at compile time. The provisioning step above does build
          # cortex-speech-app/dist - which only helps a package that stays put. The local target had
          # the flag from the start; this job never got it.
          #
          # Measured on run 31238862396 (2026-08-08): baseline exited 101 with "The `frontendDist`
          # configuration is set to `\"../dist\"` but this path doesn't exist", cargo-mutants reported
          # "cargo build failed in an unmutated tree, so no mutants were tested", and outcomes.json
          # recorded total_mutants: 0 against "Found 16 mutants to test". This job had failed every
          # night since at least 2026-07-30, so the charter's "0 surviving mutants" leg has been
          # VACUOUS for that whole period - not passing, never running.
          #
          # Mutating the source tree is safe on a disposable runner; the dirty-checkout risk the
          # Makefile warns about applies to a developer's working copy, not to a fresh CI clone.
          cargo mutants --in-place --in-diff /tmp/core.diff

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report
          path: cortex-speech-app/src-tauri/mutants.out/
          if-no-files-found: ignore
