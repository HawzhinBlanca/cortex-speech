name: Nightly Real Audio

# Lives at the repo root so GitHub Actions discovers it. The Tauri app is in the
# cortex-speech-app/ subdirectory, so the job sets
# defaults.run.working-directory: cortex-speech-app for its shell steps and the
# actions/cache inputs (which do NOT honor that default) use explicit
# cortex-speech-app/ prefixes.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      real_audio_dir:
        description: 'Path to folder with Kurdish MP4/WAV fixtures'
        required: false
        type: string

concurrency:
  group: nightly-real-audio
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  real-audio:
    name: Real audio + ASR (optional fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: cortex-speech-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cortex-speech-app/src-tauri/target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('cortex-speech-app/src-tauri/Cargo.lock') }}

      - name: Run ignored real-audio tests when fixtures available
        env:
          CORTEX_REAL_AUDIO_DIR: ${{ github.event.inputs.real_audio_dir || vars.CORTEX_REAL_AUDIO_DIR || '' }}
        run: |
          if [ -z "$CORTEX_REAL_AUDIO_DIR" ] || [ ! -d "$CORTEX_REAL_AUDIO_DIR" ]; then
            # Honest signal: a SKIP is not a PASS. Emit a visible warning annotation so a green
            # nightly is never mistaken for "the real OmniASR pipeline was exercised".
            echo "::warning title=Real-audio suite skipped::No CORTEX_REAL_AUDIO_DIR fixture provided - the real OmniASR pipeline was NOT exercised. A green run here does NOT mean real-audio passed. Run npm run test:e2e:real or set CORTEX_REAL_AUDIO_DIR on a runner with the ONNX models."
            exit 0
          fi
          cd src-tauri
          cargo test --test real_audio -- --ignored --nocapture

      - name: Soak import stability
        run: cargo test --test soak -- --nocapture
        working-directory: cortex-speech-app/src-tauri

      - name: Fine-tuned accuracy regression gate (when gold + model provided)
        working-directory: cortex-speech-app
        env:
          CORTEX_FINETUNED_GOLD: ${{ vars.CORTEX_FINETUNED_GOLD || '' }}
          CORTEX_FINETUNED_MODEL: ${{ vars.CORTEX_FINETUNED_MODEL || '' }}
          CORTEX_FINETUNED_ONNX: ${{ vars.CORTEX_FINETUNED_ONNX || '' }}
          CORTEX_SCORECARD_BASELINE: docs/finetuned_scorecard_baseline.json
        run: |
          if [ -z "$CORTEX_FINETUNED_GOLD" ] || [ ! -f "$CORTEX_FINETUNED_GOLD" ] || [ -z "$CORTEX_FINETUNED_ONNX" ]; then
            echo "::warning title=Fine-tuned accuracy gate skipped::No CORTEX_FINETUNED_GOLD/ONNX provided - the fine-tuned CER regression gate did NOT run. A green run here does NOT mean accuracy held. Provide the gold manifest + model.onnx to enforce 21.00% +/- band (docs/finetuned_scorecard_baseline.json)."
            exit 0
          fi
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers soundfile jiwer onnxruntime numpy
          # Exits non-zero if micro CER exceeds the committed baseline ci_hi by > the noise margin.
          python scripts/scorecard_finetuned.py "$CORTEX_FINETUNED_GOLD" 3000
