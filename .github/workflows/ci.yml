name: Release Gate

# This workflow lives at the repository root so GitHub Actions actually discovers
# it (Actions only scans <repo-root>/.github/workflows). The Tauri app lives in
# the cortex-speech-app/ subdirectory, so the build jobs set
# `defaults.run.working-directory: cortex-speech-app` for their shell steps.
# `uses:` action inputs (cache paths, cache-dependency-path) do NOT honor that
# default, so those are written with the explicit cortex-speech-app/ prefix.
# The governance gate runs at the repo root (scripts/verify_10.py is a root-level
# tool) and is invoked via $GITHUB_WORKSPACE so it is working-directory-independent.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test isolation from the ambient environment. ApiKeys::load layers the process environment over
  # secrets.env, and a BLANK value counts as unset; blanking both names here guarantees no runner
  # secret can ever reach a test binary. This lives in the workflow, not in a .cargo/config.toml:
  # the owner-proof helper build refuses any cargo config other than the registered
  # src-tauri/.cargo/config.toml (2026-09-02, a root config broke proof preparation for five hours).
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""

jobs:
  governance-gate:
    name: Provenance & License Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Fails the build on version/license drift, an invalid provenance ledger,
      # or a license-incompatible (share-alike / NonCommercial / no-redist)
      # corpus being marked for redistribution. Invoked via $GITHUB_WORKSPACE so
      # it is independent of the per-job working directory.
      - name: Verify 10/10 gates (manifests, ledger schema, license compatibility)
        run: python "${{ github.workspace }}/scripts/verify_10.py" --static

  rust-coverage-prerequisite:
    # Owner decision 2026-08-31: hosted 4-core Windows runners cannot complete the instrumented
    # coverage phase inside the 180-minute policy cap (measured twice, killed mid-build with no
    # measurement), so CI verifies the hash-bound attestation the release workstation publishes
    # for the exact head instead of re-measuring on hardware the exe never ships from. The
    # verifier recomputes everything git and the committed contracts can prove: sha ancestry with
    # an attestation-only diff, the measured commit's tree digest, registry/toolchain contract
    # equality, freshness, and the floor arithmetic over the embedded per-metric counts.
    name: Rust Coverage Prerequisite
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Verify the workstation-published coverage attestation for this head
        run: python "${{ github.workspace }}/scripts/verify_10.py" --verify-coverage-attestation

  windows-release-gate:
    name: Windows Release Gate
    # Owner decision 2026-09-01: coverage is a STANDING CAMPAIGN, not a merge dependency. This job
    # used to `needs:` the coverage prerequisite and refuse without it. The 80% branch floor was set
    # without ever measuring that this codebase could reach it, and the measurement says it cannot:
    # at wave 5 (2555 tests, 468 of them added across two waves) branches stood at 66.76% and were
    # buying +0.80pp per wave while efficiency halved, needing ~12 more waves; a documented share of
    # the remaining arms is provably unreachable (a UNIQUE constraint no PRAGMA can disable, guards
    # already refused earlier in their own loop, NTFS case-insensitivity). The attestation job below
    # still RUNS and still reports honestly; it simply no longer blocks the required status.
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: cortex-speech-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex-speech-app/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cortex-speech-app/src-tauri/target
          key: windows-cargo-${{ hashFiles('cortex-speech-app/src-tauri/Cargo.lock') }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked

      - name: Install Node dependencies
        run: npm ci

      # Provision + SHA-256-verify the gitignored VAD/ORT runtime support into src-tauri/models/ so tauri-build
      # finds the declared bundle.resources when `cargo` compiles the crate (clippy/test run build.rs
      # -> tauri-build, which validates resource existence). No auxiliary ASR is fetched or bundled.
      - name: Fetch + verify runtime support (bundle.resources)
        run: npm run fetch-models

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      # tauri::generate_context! (compiled by clippy / cargo test below) requires build.frontendDist
      # ("../dist") to exist. This job never runs `tauri build` (which would trigger the
      # beforeBuildCommand), so build the frontend explicitly here -- mirrors the Linux/macOS smoke jobs.
      - name: Build frontend (dist/ for tauri generate_context)
        run: npm run build

      - name: Python policy regressions
        run: |
          npm run setup:python-policies
          npm run test:python-policies

      - name: Fail-closed Rust production-module architecture
        run: python scripts/rust_quality_gate.py architecture

      - name: Lint
        run: npm run lint

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      # This is a UI smoke test against a MOCKED Tauri backend (e2e/helpers/tauri-mock.ts): it
      # exercises Svelte wiring against canned IPC data and does NOT run the real Rust pipeline
      # (no decode / VAD / OmniASR / SQLite / export). The real-app end-to-end gate is
      # `npm run test:e2e:real` (e2e_real_app.cjs), which drives the built .exe over CDP and asserts
      # a non-blank transcript -- it needs the ONNX models + a real audio fixture, so it runs on a
      # machine that has them (locally / a self-hosted Windows runner), not on this hosted runner.
      - name: E2E UI smoke (mocked backend)
        run: npm run test:e2e

      - name: npm audit
        run: npm audit --omit=dev

      # A clean audit only says "no known CVE in what resolved". It says nothing about whether the
      # tree resolved correctly: on 2026-08-06 the audit was green while npm ls exited ELSPROBLEMS.
      - name: npm dependency tree is valid
        run: npm ls --all

      - name: cargo deny
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  linux-build-smoke:
    name: Linux Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cortex-speech-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux system deps
        # READ FROM THE LOG, not inferred (fifth failure 2026-08-19): the runner's apt mirror list
        # puts azure.archive.ubuntu.com first, and that host was DOWN -- every index fetch printed
        # `Ign:` against it, waited out its timeout, retried, and only then fell back to
        # archive.ubuntu.com (which answered instantly). Four suites x many index files x
        # timeout x retries burned the whole step budget inside `apt-get update`; the install
        # loop never ran. My earlier "Acquire::Retries=5" made it WORSE: more retries against
        # a dead host. So: point apt straight at the canonical archive, skip the dead mirror
        # entirely, keep one short retry for genuine hiccups.
        timeout-minutes: 10
        run: |
          # Replace the runner's mirror list with the canonical archive only. The file holds
          # one mirror per line; apt tries them in order and waits for each.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15                -o DPkg::Lock::Timeout=120 install -y --no-install-recommends                libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex-speech-app/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - run: npm ci
      # Runtime support must exist before cargo build: tauri-build validates bundle.resources.
      - run: npm run fetch-models
      # dist/ MUST exist before the Python policies: test_generated_ipc_bindings.py shells out to
      # `cargo run --bin generate_ipc_bindings`, which compiles the lib -- and lib.rs's
      # tauri::generate_context! panics at proc-macro time when build.frontendDist ("../dist") is
      # missing. Running policies before `npm run build` is why that gate passed on Windows (which
      # already ordered build -> policies) and failed on every Linux/macOS run.
      - run: npm run build
      - run: npm run setup:python-policies
      - run: npm run test:python-policies
      - run: cargo build --manifest-path src-tauri/Cargo.toml --bin cortex-speech-app

  macos-build-smoke:
    name: macOS Build Smoke
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cortex-speech-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cortex-speech-app/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - run: npm ci
      # Runtime support must exist before cargo build: tauri-build validates bundle.resources.
      - run: npm run fetch-models
      # dist/ before policies -- see the Linux job: the IPC-contract gate compiles the lib, and
      # tauri::generate_context! requires build.frontendDist to exist.
      - run: npm run build
      - run: npm run setup:python-policies
      - run: npm run test:python-policies
      - run: cargo build --manifest-path src-tauri/Cargo.toml --bin cortex-speech-app
