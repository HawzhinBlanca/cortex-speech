version: 2
# Dependency-Update-Tool (blueprint M2.5 / OpenSSF Scorecard). Keeps SHA-pinned GitHub Actions,
# Rust crates, and npm packages current with grouped weekly PRs. Workflows live at the repo root;
# the Tauri app + its Rust crate live under cortex-speech-app/.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/cortex-speech-app/src-tauri"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/cortex-speech-app"
    schedule:
      interval: "weekly"
