[graph]
targets = [
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "none"
# Owner-workstation certification carries no advisory suppression. If an upstream-only finding is
# genuinely unreachable, that limitation belongs in a red, reviewable proof artifact until the
# patched dependency can be locked; it must not turn the dependency gate green.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Skip license-vetting crates marked `publish = false` — i.e. cortex-speech-app ITSELF, whose
# PolyForm-Noncommercial-1.0.0 is the owner's deliberate choice, not a dependency risk. This gate
# exists to vet THIRD-PARTY licenses, and allow-listing PolyForm here would have let any dependency
# adopt a noncommercial license unnoticed. The allow-list below stays exactly as strict as before.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
