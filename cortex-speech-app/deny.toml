[graph]
targets = [
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "none"
# Documented, dated triage (added 2026-07-02). NOT a blanket suppression: each entry is a specific
# advisory that is (a) not reachable as a runtime attack surface in Cortex and (b) has no patched
# version available in the range our dependency tree accepts. Remove each as soon as the upstream
# bump lands. Re-audit on every dependency update.
ignore = [
  # quick-xml XML-parsing DoS (quadratic attr scan / unbounded namespace alloc). quick-xml 0.39.4 is
  # pulled ONLY by `plist` -> tauri-utils (Tauri's bundle/config tooling); on the Windows target it is
  # build-time only and never parses attacker-controlled XML at runtime. `cargo update -p quick-xml`
  # finds no in-range patch (plist pins ^0.39). Revisit when Tauri/plist bump quick-xml.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
