name: Release

# Tag-triggered release gate. Runs the full clean-release gate from docs/RELEASE.md
# in order, then builds the desktop bundle. Keep the command list byte-identical to
# docs/RELEASE.md (enforced by scripts/test_workflow_policy.py).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Verify clean gate and build bundle
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      # Playwright Chromium MUST be installed before the E2E step runs.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Honesty and privacy policy gates
        run: npm run test:python-policies
      - name: Lint
        run: npm run lint
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
      - name: Production dependency audit (npm)
        run: npm audit --omit=dev
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Supply-chain audit (cargo-deny)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: Build desktop bundle
        run: npm run tauri build
