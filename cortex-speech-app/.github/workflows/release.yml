name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - if: startsWith(matrix.os, 'macos')
        run: brew install gtk+3
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked
      - run: npm ci
      - if: startsWith(matrix.os, 'ubuntu')
        run: npx playwright install --with-deps chromium
      - if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python-policies
      - run: npm run lint
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: Build Tauri app
        run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-speech-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/**
          generate_release_notes: true
