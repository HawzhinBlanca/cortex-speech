name: Nightly real-audio

# Heavy, non-PR-blocking checks that need real audio fixtures and long soak runs.
# When no fixture directory is configured the real-audio leg skips cleanly (exit 0)
# rather than failing, but a configured-and-failing run is a hard failure: the job
# is never marked non-blocking, so a genuine regression turns the run red.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-audio:
    name: Real-audio regression and soak
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Real-audio regression (skips cleanly when no fixtures are configured)
        shell: bash
        working-directory: src-tauri
        run: |
          if [ -z "${CORTEX_REAL_AUDIO_DIR:-}" ]; then
            echo "No CORTEX_REAL_AUDIO_DIR - skipping real-audio suite"
            exit 0
          fi
          cargo test --test real_audio -- --ignored --nocapture
      - name: Soak test
        shell: bash
        working-directory: src-tauri
        run: cargo test --test soak -- --nocapture
