[package]
name = "cortex-speech-app"
version = "2.1.0"
edition = "2021"
default-run = "cortex-speech-app"
description = "Production-grade Kurdish (Sorani) speech transcription, processing, and dataset curation app"
authors = ["Wareen <hawzhin88@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
# Never published to crates.io — this is the desktop app itself, not a library. Also lets
# cargo-deny's [licenses] private.ignore skip OUR own license without allow-listing
# PolyForm-Noncommercial for third-party crates.
publish = false
repository = "https://github.com/HawzhinBlanca/cortex-speech"

[lib]
name = "cortex_speech_app_lib"
# "lib" (rlib) is all the desktop binary links. The Tauri-template "cdylib"/"staticlib" exist only
# for iOS/Android targets this Windows-only app never builds — and the cdylib breaks every fuzz
# build (cargo-fuzz links with /include:main on MSVC, which a cdylib cannot satisfy: LNK2001).
# Re-add them if mobile targets ever land.
crate-type = ["lib"]

[package.metadata]
resources = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri ecosystem
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
blake3 = "1"
rayon = "1"
lru = "0.18"
sysinfo = "0.39"
unicode-normalization = "0.1.23"

# Async runtime
# "time" for the champion-supervision tick (engine_runtime's tokio::time::sleep) — no net coupling.
tokio = { version = "1", features = ["sync", "time"] }

# DPAPI blob transport encoding for api_keys (0.22 already in the tree transitively — dedupes).
base64 = "0.22"

# Logging (structured tracing)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"

# Audio ingestion (pure Rust decoder)
symphonia = { version = "0.6", features = ["all"] }

# WAV/FLAC audio export
hound = "3"
flacenc = "0.4"

# ONNX Runtime for Silero VAD (dynamic load avoids CRT clash with sherpa-onnx on Windows)
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

# Meta OmniASR CTC via sherpa-onnx
sherpa-onnx = "1.13.2"

# OmniASR model archive extraction
tar = "0.4"
bzip2 = "0.5"

# HTTP client for model downloads and LLM API
ureq = { version = "2", features = ["tls", "json"] }
# Couch Review: maintained tiny-http fork with request-smuggling/header-injection fixes. The local
# alias keeps call sites stable; the exact version is pinned because this is a LAN-facing parser.
tiny_http = { package = "tiny_http_fork", path = "vendor/tiny_http_fork", version = "=0.12.14", features = ["ssl-rustls"] }
rcgen = "0.14.8"

# SHA256 verification for downloaded models
sha2 = "0.11"

# Array operations (matches ort's ndarray version)
ndarray = "0.17"
parquet = { version = "59.0.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "59.0.0"
arrow-schema = "59.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

[[bench]]
name = "normalizer"
path = "benches/normalizer_bench.rs"
harness = false

[[bench]]
name = "diff"
path = "benches/diff_bench.rs"
harness = false

[[bench]]
name = "audio"
path = "benches/audio_bench.rs"
harness = false

# DPAPI (CryptProtectData) for at-rest API-key protection in api_keys.rs. Windows-only by nature;
# 0.61 already in the tree transitively — dedupes. Foundation carries LocalFree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
