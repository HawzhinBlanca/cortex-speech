[package]
name = "cortex-speech-app"
version = "2.1.0"
edition = "2021"
default-run = "cortex-speech-app"
description = "Production-grade Kurdish (Sorani) speech transcription, processing, and dataset curation app"
authors = ["Cortex Team"]
license = "Apache-2.0"
repository = "https://github.com/HawzhinBlanca/cortex-speech"

[lib]
name = "cortex_speech_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[package.metadata]
resources = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri ecosystem
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
blake3 = "1"
rayon = "1"
lru = "0.16"
sysinfo = "0.33"
unicode-normalization = "0.1.23"

# Async runtime
tokio = { version = "1", features = ["sync"] }

# Logging (structured tracing)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# Audio ingestion (pure Rust decoder)
symphonia = { version = "0.5", features = ["all"] }

# WAV/FLAC audio export
hound = "3"
flacenc = "0.4"

# ONNX Runtime for Silero VAD (dynamic load avoids CRT clash with sherpa-onnx on Windows)
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

# Meta OmniASR CTC via sherpa-onnx
sherpa-onnx = "1.13.2"
sherpa-onnx-sys = "1.13.2"

# OmniASR model archive extraction
tar = "0.4"
bzip2 = "0.5"

# HTTP client for model downloads and LLM API
ureq = { version = "2", features = ["tls", "json"] }

# SHA256 verification for downloaded models
sha2 = "0.10"

# Compression ratio for ASR repetition detection
flate2 = "1"

# Array operations (matches ort's ndarray version)
ndarray = "0.17"

# FFT for mel filterbank feature extraction
rustfft = "6"
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "58.3.0"
arrow-schema = "58.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
assert_cmd = "2"

[[bench]]
name = "normalizer"
path = "benches/normalizer_bench.rs"
harness = false

[[bench]]
name = "diff"
path = "benches/diff_bench.rs"
harness = false

[[bench]]
name = "audio"
path = "benches/audio_bench.rs"
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
