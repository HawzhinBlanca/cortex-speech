# cargo-nextest configuration (Week-1 reliability item: per-test process isolation + timeouts +
# flaky detection). ADDITIVE: `cargo test` remains a mandatory gate; nextest adds per-test process
# isolation (no shared statics/rate-limiter state between tests) and, crucially, per-test TIMEOUTS —
# a hung test (the couch join() deadlock class this repo already hit live) gets killed and reported
# instead of wedging the whole run forever.

[profile.default]
# A test running >60s is reported slow; at 3 periods (180s) it is terminated and FAILS. The whole
# --lib suite finishes in ~60s, so any single test past 3 minutes is hung, not slow.
slow-timeout = { period = "60s", terminate-after = 3 }
# STRICT: no automatic retries. Doctrine (docs/MONTH_LOOP.md standing items): a test that flakes even
# once gets root-caused the same run or quarantined with a ledger entry — never silently retried green.
retries = 0

# Deliberate flake-hunting profile: `cargo nextest run --profile flaky-hunt`. Retries make nextest mark
# pass-on-retry tests as FLAKY in the output (detection), and fail-fast=false surveys the whole suite.
# Never use this profile as a pass/fail gate — the default profile is the gate.
[profile.flaky-hunt]
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
