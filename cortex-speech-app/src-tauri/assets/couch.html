<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cortex</title>
<!--
  ADD TO HOME SCREEN. These meta tags give a full-screen, chrome-free app launched from a home-screen
  icon on iOS — which is the owner's phone and the realistic reviewer device.

  DELIBERATELY NO service worker and NO web app manifest, and this is a browser constraint rather
  than a shortcut: service workers require a SECURE CONTEXT, and this page is plain HTTP on a LAN or
  tailnet IP. Tailscale does not change that — it is still http://100.x.y.z. So genuine offline
  caching and Android/Chrome installability are UNREACHABLE here without TLS, which docs/
  REMOTE_REVIEW_PLAN.md deliberately rules out. What IS reachable is the standalone iOS experience
  below, so that is what this claims. The outbox (localStorage) covers the connectivity gap a service
  worker would otherwise have handled.
-->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Cortex" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
<!--
  PHONE STRINGS. Kurdish-first, like the desktop app: the page opens in Sorani (RTL) and the reviewer
  can switch to English. Serving an English chrome around a Kurdish text box was the single largest UX
  defect of the remote surface (docs/REMOTE_REVIEW_PLAN.md §1.1).

  `source` names the desktop i18n key each Sorani string was COPIED FROM, byte for byte.
  scripts/test_couch_page_i18n.py enforces that: a sourced string must still match its desktop value
  exactly, so the phone can never drift away from text a native speaker already reviewed, and en/ckb
  key sets must stay identical. `source: null` means genuinely NEW Sorani that has NOT had a native
  review — the policy pins that list so it can never grow silently.
-->
<script id="i18n" type="application/json">
{
  "en": {
    "progress": "Clip {n} of {total}",
    "accept": "Looks good",
    "bad": "Reject",
    "save": "Save & next",
    "undo": "Undo review",
    "saved": "Saved",
    "markedBad": "Reject",
    "undone": "Decision undone — the clip is back in the queue.",
    "undoFailed": "Undo failed",
    "saveFailed": "Failed to save edit: {err}",
    "loadFailed": "Failed to load queue: {err}",
    "allDone": "All clips reviewed!",
    "heldByOthers": "{n} clip(s) are with the other reviewers. Refresh later.",
    "editHint": "Listen, and correct the text if needed"
  },
  "ckb": {
    "progress": "پارچەی {n} لە {total}",
    "accept": "دروستە",
    "bad": "ڕەتکردنەوە",
    "save": "پاشەکەوت و دواتر",
    "undo": "گەڕاندنەوەی پێداچوونەوە",
    "saved": "پاشەکەوتکرا",
    "markedBad": "ڕەتکردنەوە",
    "undone": "بڕیارەکە گەڕایەوە — پارچەکە گەڕایەوە بۆ ڕیزەکە.",
    "undoFailed": "گەڕاندنەوە سەرکەوتوو نەبوو",
    "saveFailed": "پاشەکەوتی دەستکاری سەرکەوتوو نەبوو: {err}",
    "loadFailed": "بارکردنی ڕیز سەرکەوتوو نەبوو: {err}",
    "allDone": "هەموو پارچەکان پێداچوونەوەیان بۆ کرا!",
    "heldByOthers": "{n} پارچە لای پێداچوونەوەرانی تر ماوە. دواتر تازەی بکەرەوە.",
    "editHint": "گوێ بگرە، ئەگەر پێویست بوو دەقەکە ڕاست بکەرەوە"
  },
  "source": {
    "progress": "review.progress",
    "accept": "review.acceptAsIs",
    "bad": "inbox.reject",
    "save": "review.saveNext",
    "undo": "review.undoLast",
    "saved": "saved",
    "markedBad": "inbox.reject",
    "undone": "review.undone",
    "undoFailed": "review.undoFailed",
    "saveFailed": "inbox.status.editFailed",
    "loadFailed": "inbox.status.loadFailed",
    "allDone": "review.allDone",
    "heldByOthers": null,
    "editHint": "review.editHint"
  }
}
</script>
<style>
  /* Light and dark, driven by the phone's own setting. The page was hardcoded dark, which is
     unreadable on a phone held outdoors — and reviewing happens wherever the reviewer happens to be,
     not at a desk. Colours live in variables so both themes are defined once, together. */
  :root {
    color-scheme: light dark;
    --bg: #f8fafc; --panel: #ffffff; --line: #cbd5e1; --ink: #0f172a; --dim: #475569; --faint: #64748b;
    /* `--brand` is separate from `--accent-line` because the two have different jobs: one is a text
       colour that must clear 4.5:1 against the page, the other is a border on a filled button. Sharing
       them put the heading at 3.91:1 in light mode — caught by the axe gate, not by eye. */
    --brand: #075985;
    --accent: #0369a1; --accent-line: #0284c7; --ok: #15803d; --ok-line: #166534;
    --bad: #b91c1c; --warn: #a16207; --chip: #e2e8f0;
    /* Reviewer-adjustable transcript size (see the A-/A+ control). Sorani at a fixed 18px is small
       for some readers, and there was no way to change it. */
    --tsize: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* --faint is #94a3b8, not the #64748b it was: on the dark panel that read 3.64:1 and failed AA
         for the clip's duration/speaker line. */
      --bg: #0b1220; --panel: #111a2e; --line: #334155; --ink: #e2e8f0; --dim: #94a3b8; --faint: #94a3b8;
      --brand: #7dd3fc;
      --accent: #0369a1; --accent-line: #0284c7; --ok: #14532d; --ok-line: #166534;
      --bad: #fda4af; --warn: #fcd34d; --chip: #1e293b;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  /* `hidden` is only a display:none DEFAULT, and an explicit `display` in a rule beats it. #card sets
     display:flex, so every `card.hidden = true` was a no-op: the empty card stayed on screen next to
     the "all reviewed" message. Caught by looking at the rendered page, not by any test. */
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink);
         /* vh first as the fallback: dvh is the one that accounts for a mobile browser's collapsing
            address bar, but a browser that does not know it must still get a full-height layout
            rather than a card floating in a short page. */
         min-height: 100vh; min-height: 100dvh;
         display: flex; flex-direction: column; padding: 12px; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { font-size: 15px; color: var(--brand); }
  #who { font-size: 11px; color: var(--dim); font-weight: 600; }
  #progress { font-size: 12px; color: var(--dim); }
  /* The language and text-size controls mirror the desktop `locale-toggle`. Language labels are the
     language's own endonym, so each reads correctly whichever locale is active. */
  .chip { flex: 0 0 auto; padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 999px;
          border: 1px solid var(--line); background: var(--chip); color: var(--dim); }
  #card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
          display: flex; flex-direction: column; gap: 12px; flex: 1; }
  audio { width: 100%; }
  /* Transport row: replay-last-2s, loop and speed. A transcriber re-listens to the same second many
     times per clip; a bare <audio> makes that a fiddly drag on a phone-sized scrubber. */
  .transport { display: flex; gap: 8px; align-items: center; }
  .transport button { flex: 1; padding: 9px 6px; font-size: 13px; font-weight: 600; }
  .transport button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-line); color: #f1f5f9; }
  #warn { font-size: 12px; color: var(--warn); text-align: center; }
  textarea { width: 100%; min-height: 34dvh; background: var(--bg); color: var(--ink);
             border: 1px solid var(--line); border-radius: 10px; padding: 12px;
             font-size: var(--tsize); line-height: 1.9; direction: rtl; }
  .meta { font-size: 11px; color: var(--faint); }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--chip); color: var(--ink); font-size: 14px; font-weight: 600;
           /* Sorani labels are longer than their English counterparts and wrapped mid-phrase at
              375px; keep each action on one line and let the font shrink instead. */
           white-space: nowrap; }
  button:disabled { opacity: 0.45; }
  #save   { background: var(--accent); border-color: var(--accent-line); color: #f1f5f9; }
  #accept { background: var(--ok); border-color: var(--ok-line); color: #f1f5f9; }
  #bad    { color: var(--bad); }
  #undo   { flex: 0 0 auto; padding: 14px 16px; }
  #done, #err { text-align: center; padding: 40px 10px; font-size: 16px; }
  #err { color: var(--bad); white-space: pre-wrap; }
  .toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
           background: var(--chip); border: 1px solid var(--line); color: var(--ink); padding: 8px 18px;
           border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  /* Respect a reviewer who has asked their phone to reduce motion. */
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Cortex<span id="who"></span></h1>
  <div id="progress"></div>
  <button id="textsize" class="chip" type="button" title="A±">A±</button>
  <button id="lang" class="chip" type="button"></button>
</header>
<div id="card" hidden>
  <audio id="player" controls preload="auto"></audio>
  <div class="transport">
    <button id="again" type="button" title="↺ 2s">↺ 2s</button>
    <button id="loop" type="button" aria-pressed="false">⟳</button>
    <button id="speed" type="button">1×</button>
  </div>
  <textarea id="text" lang="ckb" dir="rtl" spellcheck="false"></textarea>
  <div class="meta" id="meta"></div>
  <div id="warn" hidden></div>
  <div class="row">
    <button id="undo">↩</button>
    <button id="bad"></button>
    <button id="accept"></button>
    <button id="save"></button>
  </div>
</div>
<div id="done" hidden></div>
<div id="err" hidden></div>
<div class="toast" id="toast"></div>
<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  let queue = [], i = 0, busy = false;

  // ── i18n ────────────────────────────────────────────────────────────────────
  const STRINGS = JSON.parse($('i18n').textContent);
  // Kurdish-first, matching the desktop app. An explicit ?lang= wins (so a link can pin a language),
  // then the reviewer's own saved choice, then ckb — NOT navigator.language, because the browser
  // language of a shared phone says nothing about which language this corpus is in.
  let locale = new URLSearchParams(location.search).get('lang')
    || localStorage.getItem('cortex.couch.lang')
    || 'ckb';
  if (!STRINGS[locale]) locale = 'ckb';
  // Fall back to English for a key missing from ckb, exactly like the desktop dictionary does, so a
  // gap shows the other language rather than a raw key.
  const t = (key, params) => {
    let s = (STRINGS[locale] || {})[key] ?? STRINGS.en[key] ?? key;
    for (const [k, v] of Object.entries(params || {})) s = s.replaceAll('{' + k + '}', v);
    return s;
  };
  function applyLocale() {
    localStorage.setItem('cortex.couch.lang', locale);
    document.documentElement.lang = locale;
    document.documentElement.dir = locale === 'ckb' ? 'rtl' : 'ltr';
    $('lang').textContent = locale === 'ckb' ? 'English' : 'کوردی';
    $('bad').textContent = '✗ ' + t('bad');
    $('accept').textContent = '✓ ' + t('accept');
    $('save').textContent = t('save');
    $('undo').title = t('undo');
    // The transcript box had NO accessible name at all — a screen-reader user reached an unlabelled
    // edit field and had to guess what it was for. Reuses the desktop's own review hint.
    $('text').setAttribute('aria-label', t('editHint'));
    renderProgress();
    renderEmptyState();
  }
  $('lang').onclick = () => { locale = locale === 'ckb' ? 'en' : 'ckb'; applyLocale(); };

  // ── transcript text size ───────────────────────────────────────────────────
  // Sorani at a fixed 18px is small for some readers and there was no way to change it. Cycles rather
  // than using two buttons: header space is scarce on a phone, and this is set once and forgotten.
  const SIZES = [16, 18, 21, 24, 28];
  let tsize = Number(localStorage.getItem('cortex.couch.tsize')) || 18;
  function applyTextSize() {
    if (!SIZES.includes(tsize)) tsize = 18;
    document.documentElement.style.setProperty('--tsize', tsize + 'px');
    localStorage.setItem('cortex.couch.tsize', String(tsize));
  }
  $('textsize').onclick = () => { tsize = SIZES[(SIZES.indexOf(tsize) + 1) % SIZES.length]; applyTextSize(); };

  // ── rendering ───────────────────────────────────────────────────────────────
  let heldByOthers = 0;

  function toast(msg) {
    $('toast').textContent = msg;
    $('toast').classList.add('show');
    setTimeout(() => $('toast').classList.remove('show'), 1400);
  }
  async function api(path, opts) {
    const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token), opts);
    if (!r.ok) {
      // Carry the status so callers can tell "the server refused" (a real answer, do not retry) from
      // "the request never arrived" (fetch throws a TypeError with no status, and IS worth retrying).
      const err = new Error(await r.text());
      err.status = r.status;
      throw err;
    }
    return r.headers.get('content-type')?.includes('json') ? r.json() : r;
  }
  // How many clips this reviewer has finished in this sitting. A session with no visible total is a
  // session with no sense of an ending, and the count is the cheapest form of pacing there is.
  let doneThisSession = 0;
  function renderProgress() {
    const pos = queue.length ? t('progress', { n: i + 1, total: queue.length }) : '';
    $('progress').textContent = doneThisSession ? `${pos} · ✓${doneThisSession}` : pos;
  }
  function renderEmptyState() {
    // An empty queue does NOT mean the work is finished when other reviewers are holding clips —
    // claiming "all reviewed" there would be a flat lie to whoever loaded last.
    $('done').textContent = heldByOthers ? t('heldByOthers', { n: heldByOthers }) : '🎉 ' + t('allDone');
  }
  // ── drafts, so a reload or a crash never costs a typed correction ───────────
  const draftKey = (id) => 'cortex.couch.draft.' + id;
  $('text').addEventListener('input', () => {
    const seg = queue[i];
    if (seg) localStorage.setItem(draftKey(seg.id), $('text').value);
  });

  // ── unsent decisions, so a dropped request is not a lost decision ───────────
  // Kept in localStorage rather than memory: the most likely way to lose a submit is the reviewer
  // giving up on a frozen page and reloading it. Flushed on load and whenever the phone reconnects.
  // Safe to replay because the server answers an identical re-submit as already-recorded.
  const OUTBOX = 'cortex.couch.outbox';
  const readOutbox = () => { try { return JSON.parse(localStorage.getItem(OUTBOX)) || []; } catch { return []; } };
  const writeOutbox = (v) => localStorage.setItem(OUTBOX, JSON.stringify(v));
  async function flushOutbox() {
    for (const item of readOutbox()) {
      try {
        await api('/api/decision', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(item),
        });
      } catch (e) {
        if (e.status === undefined) return; // still offline — keep everything for the next attempt
        // The server gave a real answer (409 taken, 400 invalid). Retrying can never change it, so
        // drop this one rather than wedging the queue behind a decision that will never land.
      }
      writeOutbox(readOutbox().filter((q) => q.id !== item.id));
      localStorage.removeItem(draftKey(item.id));
    }
  }
  addEventListener('online', () => void flushOutbox());

  function show() {
    const seg = queue[i];
    $('card').hidden = !seg; $('done').hidden = !!seg;
    $('warn').hidden = true;
    renderProgress();
    if (!seg) return;
    $('player').src = '/api/audio/' + encodeURIComponent(seg.id) + '?t=' + encodeURIComponent(token);
    $('player').playbackRate = speed;
    $('player').loop = looping;
    // A saved draft is a correction the reviewer already typed; it must win over the server's copy.
    $('text').value = localStorage.getItem(draftKey(seg.id)) ?? seg.text;
    $('meta').textContent = (seg.durationMs / 1000).toFixed(1) + 's' + (seg.speakerId ? ' · ' + seg.speakerId : '');
    prefetchNext();
  }
  // Warm the NEXT clip's audio while this one is being reviewed. The gap between clips is dead time,
  // and on a phone it is the difference between a steady rhythm and a stutter every few seconds.
  let prefetched = null;
  function prefetchNext() {
    const next = queue[i + 1];
    if (!next) return;
    prefetched = new Audio('/api/audio/' + encodeURIComponent(next.id) + '?t=' + encodeURIComponent(token));
    prefetched.preload = 'auto';
    prefetched.load();
  }
  async function load() {
    try {
      await flushOutbox();
      const res = await api('/api/queue');
      queue = res.items; i = 0; heldByOthers = res.heldByOthers || 0;
      renderEmptyState();
      // Show WHO the server is recording these decisions as. Every save is stored under this name, so
      // the reviewer must be able to see it — silent attribution is attribution nobody can correct.
      $('who').textContent = ' · ' + res.reviewer;
      show();
    } catch (e) { $('err').hidden = false; $('err').textContent = t('loadFailed', { err: e.message }); }
  }
  async function decide(action) {
    if (busy || !queue[i]) return;
    busy = true;
    const btns = ['save','accept','bad','undo'].map($); btns.forEach(b => b.disabled = true);
    const submission = { id: queue[i].id, action, text: $('text').value };
    try {
      await api('/api/decision', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(submission),
      });
      localStorage.removeItem(draftKey(submission.id));
      toast(action === 'bad' ? t('markedBad') : t('saved'));
      doneThisSession += 1;
      i += 1; show();
    } catch (e) {
      if (e.status === undefined) {
        // The request never reached the server. Hold it and move on rather than making the reviewer
        // sit on a dead clip — it will be replayed the moment the phone reconnects.
        writeOutbox([...readOutbox().filter((q) => q.id !== submission.id), submission]);
        toast(t('saved'));
        i += 1; show();
      } else {
        toast(t('saveFailed', { err: e.message }));
        // The server refused because someone else has this clip (409). Staying here would keep
        // re-submitting a decision that can never land, so move past it rather than trapping the reviewer.
        if (e.status === 409) { i += 1; show(); }
      }
    }
    finally { busy = false; btns.forEach(b => b.disabled = false); }
  }

  // ── transport: the controls a transcriber actually uses ────────────────────
  const SPEEDS = [0.75, 1, 1.25, 1.5];
  let speed = Number(localStorage.getItem('cortex.couch.speed')) || 1;
  let looping = localStorage.getItem('cortex.couch.loop') === '1';
  function applyTransport() {
    $('player').playbackRate = speed;
    $('player').loop = looping;
    $('speed').textContent = speed + '×';
    $('loop').setAttribute('aria-pressed', String(looping));
    localStorage.setItem('cortex.couch.speed', String(speed));
    localStorage.setItem('cortex.couch.loop', looping ? '1' : '0');
  }
  $('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; applyTransport(); };
  $('loop').onclick  = () => { looping = !looping; applyTransport(); };
  // Re-listening to the last couple of seconds is the single most repeated action in transcription,
  // and dragging a phone-sized scrubber to do it is where the time goes.
  $('again').onclick = () => {
    $('player').currentTime = Math.max(0, $('player').currentTime - 2);
    void $('player').play();
  };

  // ── keep an ACTIVE reviewer's clip from lapsing under them ─────────────────
  // Well inside the server's TTL, so a slow clip never expires while it is genuinely being worked on.
  // A 409 here means someone else took it — said NOW, while the correction can still be copied,
  // instead of at save time when it is already unsaveable.
  setInterval(async () => {
    const seg = queue[i];
    if (!seg || document.hidden) return;
    try {
      await api('/api/renew', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: seg.id }),
      });
    } catch (e) {
      if (e.status === 409) { $('warn').textContent = t('heldByOthers', { n: 1 }); $('warn').hidden = false; }
    }
  }, 4 * 60 * 1000);
  $('save').onclick   = () => decide('edit');
  $('accept').onclick = () => decide('accept');
  $('bad').onclick    = () => decide('bad');
  $('undo').onclick   = async () => {
    if (busy) return; busy = true;
    try {
      const undone = await api('/api/undo', { method: 'POST' });
      toast(t('undone'));
      await load();
      const pos = queue.findIndex((s) => s.id === undone.id);
      if (pos >= 0) i = pos;
      show();
    } catch (e) { toast(t('undoFailed') + ': ' + e.message); }
    finally { busy = false; }
  };
  // ── swipe: accept / reject without reaching for a button ───────────────────
  // Bound to the CARD, not the page, and ignored when the gesture starts on the textarea — a reviewer
  // dragging to place a cursor in their correction must never be read as a verdict. The vertical and
  // distance thresholds keep an ordinary scroll from deciding a clip.
  let touch = null;
  $('card').addEventListener('touchstart', (e) => {
    if (e.target.closest('textarea, audio, button')) { touch = null; return; }
    touch = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  }, { passive: true });
  $('card').addEventListener('touchend', (e) => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x;
    const dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) < 90 || Math.abs(dy) > 60) return;
    // Direction is meaning, not screen side: in RTL "forward" is leftward. Accept is the forward
    // gesture in both directions so the muscle memory matches the reading order.
    const forward = document.documentElement.dir === 'rtl' ? dx < 0 : dx > 0;
    void decide(forward ? 'accept' : 'bad');
  }, { passive: true });

  applyLocale();
  applyTransport();
  applyTextSize();
  load();
</script>
</body>
</html>
