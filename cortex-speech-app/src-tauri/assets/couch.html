<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8" />
<!-- `interactive-widget=resizes-content` is the declarative half of the keyboard fix (R2.4): it tells
     Android Chrome to shrink the layout viewport when the on-screen keyboard opens, so the action row
     is pushed up instead of being covered. iOS Safari ignores it, which is why the visualViewport
     listener below exists too — one of the two handles every phone a reviewer might use. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Cortex</title>
<!--
  ADD TO HOME SCREEN. These tags give a full-screen, chrome-free app launched from a home-screen icon
  on iOS and, over HTTPS (Tailscale Serve/Funnel — docs/REMOTE_PUBLIC_LINKS_PLAN.md phase 5), an
  installable app on Android Chrome. The manifest's start_url is "/" and NEVER carries a token: an
  installed app rides the HttpOnly cookie, so revoking a reviewer revokes their installed app too.

  DELIBERATELY NO service worker (plan phase 6, judgment call): it is the one addition that
  introduces a NEW failure mode — a stale cached shell after the exe (which embeds this page via
  include_str!) is rebuilt. The localStorage outbox already covers the connectivity gap, and
  Background Sync remains unsupported on iOS Safari in 2026 anyway. Revisit only if reviewers report
  the shell failing to open offline.
-->
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" type="image/png" href="/icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Cortex" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
<!--
  PHONE STRINGS. Kurdish-first, like the desktop app: the page opens in Sorani (RTL) and the reviewer
  can switch to English. Serving an English chrome around a Kurdish text box was the single largest UX
  defect of the remote surface (docs/REMOTE_REVIEW_PLAN.md §1.1).

  `source` names the desktop i18n key each Sorani string was COPIED FROM, byte for byte.
  scripts/test_couch_page_i18n.py enforces that: a sourced string must still match its desktop value
  exactly, so the phone can never drift away from text a native speaker already reviewed, and en/ckb
  key sets must stay identical. `source: null` means genuinely NEW Sorani that has NOT had a native
  review — the policy pins that list so it can never grow silently.
-->

  "source": {

    "accept": "review.acceptAsIs",

<style>
  /* Light and dark, driven by the phone's own setting. The page was hardcoded dark, which is
     unreadable on a phone held outdoors — and reviewing happens wherever the reviewer happens to be,
     not at a desk. Colours live in variables so both themes are defined once, together. */
  :root {
    color-scheme: light dark;
    --bg: #f8fafc; --panel: #ffffff; --line: #cbd5e1; --ink: #0f172a; --dim: #475569; --faint: #64748b;
    /* `--brand` is separate from `--accent-line` because the two have different jobs: one is a text
       colour that must clear 4.5:1 against the page, the other is a border on a filled button. Sharing
       them put the heading at 3.91:1 in light mode — caught by the axe gate, not by eye. */
    --brand: #075985;
    --accent: #0369a1; --accent-line: #0284c7; --ok: #15803d; --ok-line: #166534;
    --bad: #b91c1c; --warn: #a16207; --chip: #e2e8f0;
    /* Reviewer-adjustable transcript size (see the A-/A+ control). Sorani at a fixed 18px is small
       for some readers, and there was no way to change it. */
    --tsize: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* --faint is #94a3b8, not the #64748b it was: on the dark panel that read 3.64:1 and failed AA
         for the clip's duration/speaker line. */
      --bg: #0b1220; --panel: #111a2e; --line: #334155; --ink: #e2e8f0; --dim: #94a3b8; --faint: #94a3b8;
      --brand: #7dd3fc;
      --accent: #0369a1; --accent-line: #0284c7; --ok: #14532d; --ok-line: #166534;
      --bad: #fda4af; --warn: #fcd34d; --chip: #1e293b;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  /* `hidden` is only a display:none DEFAULT, and an explicit `display` in a rule beats it. #card sets
     display:flex, so every `card.hidden = true` was a no-op: the empty card stayed on screen next to
     the "all reviewed" message. Caught by looking at the rendered page, not by any test. */
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink);
         /* vh first as the fallback: dvh is the one that accounts for a mobile browser's collapsing
            address bar, but a browser that does not know it must still get a full-height layout
            rather than a card floating in a short page. */
         min-height: 100vh; min-height: 100dvh;
         display: flex; flex-direction: column; gap: 12px;
         /* SAFE AREA (R2.6) + KEYBOARD (R2.4), in one padding declaration.
            The page already shipped `viewport-fit=cover`, which is what lets it draw edge to edge —
            and therefore also what lets it draw UNDER the notch and the home indicator once a
            reviewer installs it to the home screen (display:standalone, no browser chrome to
            protect it). A flat 12px was fine in a browser tab and wrong in the installed app the
            plan is steering reviewers towards. env() resolves to 0px wherever there is no inset, so
            this is the same 12px on a desktop or an Android without cutouts.
            --kb is how much of the viewport the on-screen keyboard is covering, set by the
            visualViewport listener. On iOS the keyboard does NOT resize the layout viewport, so
            without this the Save/Accept/Reject row and the toast sat underneath it — the reviewer
            typed a correction and then could not reach the button that saves it. */
         padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
                  calc(12px + var(--kb, 0px) + env(safe-area-inset-bottom))
                  calc(12px + env(safe-area-inset-left)); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { font-size: 15px; color: var(--brand); }
  #who { font-size: 11px; color: var(--dim); font-weight: 600; }
  #progress { font-size: 12px; color: var(--dim); }
  #accounting { min-height: 16px; font-size: 11px; color: var(--dim); text-align: center; }
  #accounting.pending { color: var(--warn); }
  /* The language and text-size controls mirror the desktop `locale-toggle`. Language labels are the
     language's own endonym, so each reads correctly whichever locale is active. */
  .chip { flex: 0 0 auto; padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 999px;
          border: 1px solid var(--line); background: var(--chip); color: var(--dim); }
  #card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
          display: flex; flex-direction: column; gap: 12px; flex: 1;
          /* The swipe gesture existed but was completely invisible (R3.5): nothing moved while the
             finger moved, and crossing the 90px threshold submitted a verdict with no warning and no
             way to see you had crossed it. The card now follows the finger and snaps back — the
             transition is the snap-back; dragging turns it off so the card tracks the finger 1:1. */
          transition: transform .18s ease-out; }
  #card.dragging { transition: none; }
  /* Past the threshold: which verdict this release will cast. An inset ring rather than a background
     wash, so the transcript underneath stays readable at the moment the reviewer is deciding. */
  #card.willAccept { box-shadow: inset 0 0 0 3px var(--ok-line); }
  #card.willReject { box-shadow: inset 0 0 0 3px var(--bad); }
  @media (prefers-reduced-motion: reduce) { #card { transition: none; } }
  audio { width: 100%; }
  /* Waveform: seeing silence vs speech makes "is this clip usable?" a glance instead of a listen, and
     tapping it seeks straight to the word in doubt. Decorative in the a11y sense — the <audio> element
     above it is the real, labelled control — so it is aria-hidden and never the only way to do anything. */
  #wave { width: 100%; height: 56px; display: block; border-radius: 8px; background: var(--bg);
          border: 1px solid var(--line); touch-action: manipulation; }
  /* Transport row: replay-last-2s, loop and speed. A transcriber re-listens to the same second many
     times per clip; a bare <audio> makes that a fiddly drag on a phone-sized scrubber. */
  .transport { display: flex; gap: 8px; align-items: center; }
  .transport button { flex: 1; padding: 9px 6px; font-size: 13px; font-weight: 600; }
  .transport button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-line); color: #f1f5f9; }
  #warn { font-size: 12px; color: var(--warn); text-align: center; }
  /* Rides on the dim meta line but in the warning colour: it has to survive a glance, because it is
     information the reviewer needs BEFORE they tap, not after. */
  .flag { color: var(--warn); }
  /* font-family MUST be explicit: a textarea does NOT inherit it, and every browser's UA default is
     monospace. A monospaced Arabic-script face forces cursive, wildly-varying-width Kurdish letters
     into identical advance cells, so the joins render stretched and gappy — it reads like tatweel
     padding that is not in the text (verified 2026-08-10: tatweel count 0 in the data, fontFamily
     computed to "monospace" on the live page). Reviewers judge these clips by eye; unreadable script
     is a correctness problem, not a cosmetic one. */
  textarea { width: 100%; min-height: 34dvh; background: var(--bg); color: var(--ink);
             border: 1px solid var(--line); border-radius: 10px; padding: 12px;
             font-family: inherit;
             font-size: var(--tsize); line-height: 1.9; direction: rtl; }
  .meta { font-size: 11px; color: var(--faint); }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--chip); color: var(--ink); font-size: 14px; font-weight: 600;
           /* Sorani labels are longer than their English counterparts and wrapped mid-phrase at
              375px; keep each action on one line and let the font shrink instead. */
           white-space: nowrap; }
  button:disabled { opacity: 0.45; }
  #save   { background: var(--accent); border-color: var(--accent-line); color: #f1f5f9; }
  #accept { background: var(--ok); border-color: var(--ok-line); color: #f1f5f9; }
  #bad    { color: var(--bad); }
  #undo   { flex: 0 0 auto; padding: 14px 16px; }
  /* The honest exit. Full width so it is a real thumb target, and deliberately quieter than the three
     verdict buttons above it — always reachable, never the easy thing to tap. It sits outside `.row`,
     where `flex: 1` does nothing, so the width has to be said explicitly. */
  #skip   { width: 100%; margin-top: 8px; background: none; border-color: transparent;
            color: var(--faint); font-weight: 500; }
  #done, #err { text-align: center; padding: 40px 10px; font-size: 16px; }
  #err { color: var(--bad); white-space: pre-wrap; }
  /* Rides above the keyboard for the same reason the action row does: a confirmation the reviewer
     cannot see is a confirmation that did not happen, and "Saved" is the one message that decides
     whether they trust the tool. */
  .toast { position: fixed; bottom: calc(14px + var(--kb, 0px) + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
           background: var(--chip); border: 1px solid var(--line); color: var(--ink); padding: 8px 18px;
           border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  /* A failure that will not go away on its own has to look different from a confirmation that will,
     and has to look tappable — it is the only way to dismiss it. */
  .toast.sticky { background: var(--panel); border-color: var(--bad); color: var(--bad); cursor: pointer; }
  /* Respect a reviewer who has asked their phone to reduce motion. */
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Cortex<span id="who"></span></h1>
  <!-- LIVE REGIONS (R3.4). Every one of these changes without the reviewer doing anything at the
       moment it changes, which is precisely the case a screen reader cannot discover by itself: the
       progress counter after a decision, a warning about a clip, the drained-queue verdict. `polite`
       rather than `assertive` because none of them should interrupt a word being spoken. -->
  <div id="progress" aria-live="polite"></div>
  <button id="textsize" class="chip" type="button" title="A±">A±</button>
  <button id="lang" class="chip" type="button"></button>
</header>
<div id="accounting" aria-live="polite" hidden></div>
<div id="card" hidden>
  <audio id="player" controls preload="auto"></audio>
  <canvas id="wave" aria-hidden="true"></canvas>
  <div class="transport">
    <button id="again" type="button" title="↺ 2s">↺ 2s</button>
    <button id="loop" type="button" aria-pressed="false">⟳</button>
    <button id="speed" type="button">1×</button>
  </div>
  <textarea id="text" lang="ckb" dir="rtl" spellcheck="false"></textarea>
  <div class="meta" id="meta"></div>
  <div id="warn" aria-live="polite" hidden></div>
  <div class="row" id="actions">
    <button id="bad"></button>
    <button id="accept"></button>
    <button id="save"></button>
  </div>
  <!-- ALWAYS available (R4.4), not just when the audio fails to load. Broken audio was only the most
       obvious way to meet a clip you cannot judge; two people talking over each other, or an accent you
       do not have, leaves you just as stuck. Without this the reviewer has exactly two ways forward and
       BOTH write a verdict they cannot justify: accept, which promotes an unverified ASR draft to gold, or
       reject, which permanently excludes a clip that may be perfectly fine. Skipping writes nothing —
       it hands the clip to somebody who can judge it. Below the decision row, not in it: a fourth
       button among three would make the honest exit as prominent as the work. -->
  <button id="skip" type="button"></button>
</div>
<div id="done" aria-live="polite" hidden></div>
<!-- Undo lives OUTSIDE the card on purpose. Inside it, the button vanished with the card the moment
     the queue drained — so the one decision a reviewer is most likely to want back, the last one they
     made, was the one they could never reach. Shown whenever there is something to undo. -->
<div class="row" id="after" hidden>
  <button id="undo">↩</button>
</div>
<div id="err" role="alert" hidden></div>
<div class="row" id="errActions" hidden><button id="retry" type="button"></button></div>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
  // The token arrives in the URL FRAGMENT (#t=...), which the browser never sends to any server —
  // so a link pasted into a chat app hands its preview bot the empty shell, never a credential.
  //
  // The legacy ?t= form is GONE, on both sides. The server no longer accepts a query token at all
  // (couch.rs token_from_request), so continuing to read one here would only put a credential back
  // into URLs, history and proxy logs to buy an authentication that can no longer succeed. Removing
  // it is the prerequisite for exposing this server publicly; a pre-fragment link now gets the bare
  // shell, which is the correct answer to a link that leaked the moment it was pasted.
  const fragToken = new URLSearchParams(location.hash.replace(/^#/, '')).get('t') || '';
  // A fragment token is presented to the server exactly once, in a POST body, and comes back as the
  // HttpOnly cookie every later request rides on. Fire-and-forget BEFORE load(): claimed is awaited
  // by load() via this promise so the first /api/queue never races the cookie.
  // RETRYABLE, not one-shot. The first shipped version was a const promise created here at parse:
  // a first-ever visitor whose claim POST failed transiently (server restarting, cellular blip) fell
  // through to a 401 queue fetch and was shown "link expired" — a FALSE terminal state for a valid
  // link, unrecoverable even by reload because the fragment is stripped from the URL below. The token
  // is still right here in memory, so a failed claim must stay claimable. Only the server explicitly
  // refusing the token (401) is a real verdict; anything else is "not yet".
  let claimState = fragToken ? 'pending' : 'none'; // none | pending | ok | rejected
  async function ensureClaimed() {
    if (claimState !== 'pending') return claimState;
    try {
      const r = await fetch('/api/claim', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token: fragToken }),
      });
      if (r.ok) claimState = 'ok';
      else if (r.status === 401) claimState = 'rejected'; // the server's answer, not a hiccup
      // 429/5xx/anything else: stay pending, the next load() tries again.
    } catch { /* network: stay pending */ }
    return claimState;
  }
  void ensureClaimed(); // fire early so the cookie usually exists before the first queue fetch
  // Strip the credential from the visible address and this history entry either way: a token on
  // screen is a token anyone glancing at the phone can photograph, and history survives the session.
  // Also strip a legacy `?t=` if one is present in the address: the server no longer honours it, but
  // leaving it on screen is still a token anyone glancing at the device can photograph, and it still
  // survives in history. `queryToken` used to gate this; that variable is gone with the query-auth
  // path, and referencing it here threw at load and left the whole page uninitialised.
  if (window.history?.replaceState && (fragToken || new URLSearchParams(location.search).has('t'))) {
    const clean = new URL(location.href);
    clean.searchParams.delete('t');
    history.replaceState(null, '', clean.pathname + clean.search);
  }
  const $ = (id) => document.getElementById(id);

      // RE-SCOPE THE SHARED BANNER, on identity ARRIVAL and not only on identity CHANGE. `refused` is
      // localStorage and therefore shared by everyone who opens a link on this phone; `refusedMine()`
      // keeps each person to their own entries, but it cannot while `me` is still empty — and the
      // startup `renderRefused()` runs before /api/queue has named anybody, so `!me` matches every
      // entry and the banner goes up for all of them. The recount used to sit inside the branch
      // above, which needs a PREVIOUS identity in this tab: a new tab, the installed PWA's first
      // open, or a fresh profile has `prevWho === null`, so it never ran and the banner stayed up.
      // Measured: reviewer two opens their own link on a shared phone and is told "1 decision could
      // not be saved" about work that was reviewer one's — the exact lie the `by` stamp exists to
      // stop, still reachable through the first load. Unconditional here, and idempotent: with no
      // entries of your own it takes a stale banner DOWN, which is the same fix pointing the other way.
      renderRefused();
      sessionStorage.setItem('cortex.couch.who', me);
      // Now that the server has named this reviewer, send the stamped work the pre-identity flush
      // above rightly held back (it must never guess whose cookie it is flushing under). Fire and
      // forget: the queue is already rendered, and the 30s retry timer backstops a failure here.
      if (readOutbox().length) void flushOutbox();
      show();
    } catch (e) {
      // "Loading clips..." must not sit beside a failure message — but an EMPTY-STATE message is a
      // real answer and must survive an unrelated failure, so only the placeholder is taken down.
      if ($('done').textContent === t('loadingMore')) $('done').hidden = true;
      // A dead token is the single most likely thing a remote reviewer will hit — every outstanding
      // link is regenerated whenever the owner restarts Couch Review or reissues one. But 401 is only
      // a VERDICT when the claim itself was answered: with the claim still pending (server was
      // restarting, cellular blip), a 401 here is a race, not an expiry — showing "link expired"
      // there was a false terminal state for a perfectly valid link. Anything not a settled 401 gets
      // a Retry button and a once-a-minute auto-retry instead of a dead end.
      const expired = e.status === 401 && claimState !== 'pending';
      retryable = !expired;
      if (expired) showErr('expired', t('linkExpired'), false);
      else showErr('load', t('loadFailed', { err: e.status || '—' }), true); // status, never English (R3.3)
    } finally {
      $('retry').disabled = false;
      $('retry').textContent = '↻ ' + t('retry');
    }
  }
  // UNIQUE clip-relative media positions traversed by the renderer for the CURRENT attempt. This is
  // deliberately not called "heard" or "listened": software can prove media-element traversal, not a
  // person's physiology or attention. Replaying one half twice still covers only that half.
  let playbackTraversalMs = 0, playbackTraversalIntervals = [], playbackTraversalIdentity = null, lastPos = null;
  const MAX_TICK_ADVANCE_S = 1.5;

  function resetPlaybackTraversalBaseline() { lastPos = null; }
  function resetPlaybackTraversalCoverage(identity) {
    playbackTraversalMs = 0;
    playbackTraversalIntervals = [];
    playbackTraversalIdentity = identity || null;
    resetPlaybackTraversalBaseline();
  }
  function currentPlaybackAttemptMatches(el) {
    const seg = queue[i];
    return !!seg && !!playbackAttempt
      && playbackTraversalIdentity === playbackIdentity(seg)
      && playbackAttempt.identity === playbackIdentity(seg)
      && playerCarriesAttempt(seg, playbackAttempt.playbackReceiptId);
  }
  function playbackTraversalLimitMs(el) {
    const mediaMs = Number(el.duration) * 1000;
    const servedMs = Number(queue[i] && queue[i].durationMs);
    const mediaValid = Number.isFinite(mediaMs) && mediaMs > 0;
    const servedValid = Number.isFinite(servedMs) && servedMs > 0;
    if (mediaValid && servedValid) return Math.floor(Math.min(mediaMs, servedMs));
    if (mediaValid) return Math.floor(mediaMs);
    if (servedValid) return Math.floor(servedMs);
    return 0;
  }
  function addUniquePlaybackTraversalInterval(startMs, endMs, limitMs) {
    if (!Number.isFinite(startMs) || !Number.isFinite(endMs) || !Number.isFinite(limitMs)
        || limitMs <= 0 || endMs <= startMs) return;
    const limit = Math.max(0, Math.floor(limitMs));
    const start = Math.min(limit, Math.max(0, Math.ceil(startMs)));
    const end = Math.min(limit, Math.max(0, Math.floor(endMs)));
    if (end <= start) return;

    const merged = [];
    let nextStart = start, nextEnd = end, inserted = false;
    for (const interval of playbackTraversalIntervals) {
      if (interval.endMs < nextStart) { merged.push(interval); continue; }
      if (nextEnd < interval.startMs) {
        if (!inserted) { merged.push({ startMs: nextStart, endMs: nextEnd }); inserted = true; }
        merged.push(interval);
        continue;
      }
      nextStart = Math.min(nextStart, interval.startMs);
      nextEnd = Math.max(nextEnd, interval.endMs);
    }
    if (!inserted) merged.push({ startMs: nextStart, endMs: nextEnd });
    playbackTraversalIntervals = merged;
    playbackTraversalMs = playbackTraversalIntervals.reduce(
      (total, interval) => total + interval.endMs - interval.startMs,
      0,
    );
  }
  function observePlaybackTraversal(el) {
    if (!currentPlaybackAttemptMatches(el)) { resetPlaybackTraversalBaseline(); return; }
    const now = Number(el.currentTime);
    if (!Number.isFinite(now) || now < 0) { resetPlaybackTraversalBaseline(); return; }
    if (lastPos !== null) {
      const delta = now - lastPos;
      if (delta > 0 && delta <= MAX_TICK_ADVANCE_S) {
        addUniquePlaybackTraversalInterval(lastPos * 1000, now * 1000, playbackTraversalLimitMs(el));
      }
    }
    lastPos = now;
  }
  (function trackPlaybackTraversal() {
    const el = $('player');
    if (!el) return;
    el.addEventListener('timeupdate', () => {
      if (el.paused) { resetPlaybackTraversalBaseline(); return; }
      observePlaybackTraversal(el);
    });
    // A new media load is a new grant/attempt boundary. A previous artifact's intervals never cross it.
    el.addEventListener('loadstart', () => resetPlaybackTraversalCoverage(playbackIdentity(queue[i])));
    // Every seek is a discontinuity, including small (<1.5s) slider/waveform jumps and native loops.
    el.addEventListener('seeking', resetPlaybackTraversalBaseline);
    el.addEventListener('seeked', () => {
      if (!el.paused && currentPlaybackAttemptMatches(el) && Number.isFinite(el.currentTime)) lastPos = el.currentTime;
    });
    el.addEventListener('play', () => {
      if (currentPlaybackAttemptMatches(el) && Number.isFinite(el.currentTime)) lastPos = el.currentTime;
      else resetPlaybackTraversalBaseline();
    });
    el.addEventListener('pause', () => {
      // Capture only media position the element actually reached; then fence the next play attempt.
      if (lastPos !== null && currentPlaybackAttemptMatches(el)) observePlaybackTraversal(el);
      resetPlaybackTraversalBaseline();
    });
    el.addEventListener('ended', () => {
      if (lastPos !== null && currentPlaybackAttemptMatches(el)) observePlaybackTraversal(el);
      resetPlaybackTraversalBaseline();
    });
    el.addEventListener('error', resetPlaybackTraversalBaseline);
    el.addEventListener('abort', resetPlaybackTraversalBaseline);
    el.addEventListener('emptied', () => resetPlaybackTraversalCoverage(playbackIdentity(queue[i])));
  })();

  async function finalizePlaybackForDecision(seg) {
    const identity = playbackIdentity(seg);
    if (!playbackAttempt || playbackAttempt.identity !== identity) await preparePlayback(seg, false);
    if (!playbackAttempt || playbackAttempt.identity !== identity) {
      const error = new Error('playback authority is unavailable');
      error.status = 428;
      throw error;
    }
    if (!$('player').paused) observePlaybackTraversal($('player'));
    if (playbackAttempt.finalized) return playbackAttempt.playbackReceiptId;
    const expectedAttempt = playbackAttempt;
    const finalized = await api('/api/playback/finalize', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        playbackReceiptId: expectedAttempt.playbackReceiptId,
        clientAttemptId: expectedAttempt.clientAttemptId,
        intervals: playbackTraversalIntervals.map((interval) => ({ ...interval })),
      }),
    });
    if (playbackIdentity(queue[i]) !== identity || playbackAttempt !== expectedAttempt
        || finalized.playbackContractVersion !== 4
        || finalized.playbackReceiptId !== expectedAttempt.playbackReceiptId
        || finalized.segmentId !== seg.id
        || String(finalized.segmentRevision) !== String(seg.rowVersion)) {
      throw new Error('invalid playback finalization response');
    }
    expectedAttempt.finalized = true;
    return expectedAttempt.playbackReceiptId;
  }

  async function decide(action) {
    if (busy || !queue[i]) return;
    // A skip is the ABSENCE of a verdict, so none of what follows a decision applies to it: it is not
    // work done (counting it would inflate the ✓ tally with clips nobody judged), it must not toast
    // "Saved" over something that saved nothing, and it must NOT clear the draft — whatever the
    // reviewer typed before giving up is still theirs if the clip ever comes back to them.
    const isSkip = action === 'skip';
    busy = true;
    const btns = ['save','accept','bad','skip','undo'].map($); btns.forEach(b => b.disabled = true);
    // rowVersion: the row fingerprint this clip was SERVED with — the server refuses the decision
    // if the draft changed in between, so what gets recorded is always judged-as-seen.
    // A non-skip verdict carries only the immutable receipt returned after policy-4 finalization.
    // Finalization failure creates no outbox verdict, advances nowhere, and leaves the draft intact.
    let submission;
    try {
      const playbackReceiptId = isSkip ? undefined : await finalizePlaybackForDecision(queue[i]);
      submission = { operationId: newOperationId(), id: queue[i].id, action, text: $('text').value, reviewer: me, rowVersion: queue[i].rowVersion,
                     pilotAfterReviewEventId: queue[i].pilotAfterReviewEventId,
                     playbackReceiptId };
      // The durable write MUST precede the first network byte. If localStorage is unavailable/full,
      // do not submit: a server commit followed by a dropped response would otherwise have no stable
      // identity to replay, which is exactly the double-pay window this outbox closes.
      queueSubmission(submission);
    } catch (error) {
      // A persistence failure is NOT an offline/queued decision. Stay on the clip, keep the draft,
      // and never tell the reviewer work is durable when no outbox entry exists.
      if (error.status === 428) toast(t('mustListen'), true);
      else toast(t('saveFailed', { err: error.status || '—' }), true);
      busy = false;
      btns.forEach(b => b.disabled = false);
      return;
    }
    try {
      const saved = await api('/api/decision', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(submission),
      });
      rememberPoolUndoTarget(submission, saved);
      removeSubmission(submission.operationId);
      // Both judged-audio progress and weighted earnings come back WITH the committed decision.
      applyAccounting(saved);
      if (!isSkip) {
        sessionStorage.removeItem(draftKey(submission.id));
        clearRefused(submission.id); // re-reviewing a refused clip must retract the warning about it
        decidedHere.add(submission.id); // so a STALE outbox replay of this clip cannot claim work was lost
        toast(action === 'bad' ? t('markedBad') : t('saved'));
        doneThisSession += 1;
      }
      // A DECISION is the "next" gesture and starts the next clip (R2.2). A skip is not: the reviewer
      // just said they could not judge one, and answering that with a burst of audio is the opposite
      // of what they need. The clip loads and waits for them.
      i += 1; show(!isSkip);
    } catch (e) {
      // HOLD, and move on. None of these is a verdict on the decision itself, so the reviewer must
      // not lose it and must not be stranded on the clip:
      //   no status  — the request never reached the server (offline).
      //   401        — the LINK died mid-session, which happens whenever the owner restarts Couch
      //                Review or reissues a link (adding a second reviewer does it). Only toasting
      //                here meant every decision made after that moment was dropped: the typed text
      //                survived in the draft, but the accept/reject verdict did not.
      //   429        — THROTTLED, which is the server saying "later", not "no". The couch limiter is
      //                120/min per reviewer with a 60 burst; a phone that reloads in a loop, or a
      //                fast run of accepts on obvious clips (each clip costs an audio fetch, a
      //                prefetch and a decision), can reach it. Treating the canonical retry-later
      //                status as a permanent verdict threw the decision away at exactly the moment
      //                the reviewer was working fastest. Found by the 130-clip drain soak.
      //   5xx        — the server is unwell, not disagreeing.
      // Held decisions replay on the next working link, so the reviewer can keep going meanwhile.
      if (e.status === undefined || e.status === 401 || e.status === 429 || e.status >= 500) {
        if (e.status === 401) {
          // Say it once, persistently — a toast about a dead link vanishes before it is understood,
          // and this one needs an action from the reviewer (ask for a new link).
          showErr('expired', t('linkExpired'), false);
        } else {
          // NOT "Saved" — it is not saved, it is queued. Telling a reviewer their work is safe when it
          // is still sitting in localStorage is what made every later loss invisible: they had already
          // been reassured, so they had no reason to check anything.
          toast(t('queued'));
        }
        // Queued still counts as decided — the reviewer judged this clip and is moving on, so the
        // rhythm continues. (The 409 path below does NOT autoplay: that is a forced skip, not a
        // decision, and it deserves the reviewer's attention rather than more audio. Nor does a
        // deliberate skip, for the same reason.)
        i += 1; show(!isSkip);
      } else {
        // The STATUS, not the message (R3.3). `e.message` is raw English from the server, and dropping
        // it inside a Sorani sentence produced exactly the thing this page exists to avoid: the one word
        // that says what went wrong, in a language the reviewer may not read. A status code is
        // language-neutral, still diagnostic, and fits the reviewed string's existing {err} slot with no
        // new Sorani. A transport failure has no status at all, and a dash is more honest there than
        // "Failed to fetch" — the Retry affordance is what actually helps.
        // 428: the clip was not played enough to judge it. This is the ONE refusal the reviewer can
        // fix themselves, so it gets a sentence rather than a status code — and the page stays on the
        // clip, because replaying it is exactly what they should do next.
        // The ATTRIBUTION fence: this cookie belongs to a different reviewer right now (another
        // tab / the PWA claimed a colleague's link). The verdict itself is fine — queue it under
        // its author's stamp for the flush that runs when their link is current again, instead of
        // discarding a judgement over a cookie race (2026-08-20 hunt).
        if (e.status === 409 && submission.reviewer && /was made by/.test(e.message || '')) {
          toast(t('queued'));
          i += 1; show();
          return;
        }
        // The server gave a final answer about this operation. It did not commit, so retire this UUID;
        // keeping it would replay a known refusal forever. Retryable/attribution failures returned
        // above and deliberately leave the exact durable entry intact.
        removeSubmission(submission.operationId);
        if (e.status === 428) {
          // Finalization succeeded, so a 428 here means the durable authority no longer matches the
          // decision coordinates. It cannot be repaired by resending the same receipt: retire the
          // local attempt, request a fresh exact grant, and require traversal again on this clip.
          invalidatePlaybackPreparation();
          resetPlaybackTraversalCoverage(playbackIdentity(queue[i]));
          $('player').pause();
          $('player').removeAttribute('src');
          void preparePlayback(queue[i], false);
          toast(t('mustListen'), true);
        } else toast(t('saveFailed', { err: e.status || '—' }), true);
        // The server refused because someone else has this clip (409). Staying here would keep
        // re-submitting a decision that can never land, so move past it rather than trapping the reviewer.
        if (e.status === 409) { i += 1; show(); }
      }
    }
    finally { busy = false; btns.forEach(b => b.disabled = false); }
  }

  // ── transport: the controls a transcriber actually uses ────────────────────
  const SPEEDS = [0.75, 1, 1.25, 1.5];
  let speed = Number(localStorage.getItem('cortex.couch.speed')) || 1;
  let looping = localStorage.getItem('cortex.couch.loop') === '1';
  function applyTransport() {
    $('player').playbackRate = speed;
    $('player').loop = looping;
    $('speed').textContent = speed + '×';
    $('loop').setAttribute('aria-pressed', String(looping));
    localStorage.setItem('cortex.couch.speed', String(speed));
    localStorage.setItem('cortex.couch.loop', looping ? '1' : '0');
  }
  $('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; applyTransport(); };
  $('loop').onclick  = () => { looping = !looping; applyTransport(); };
  // Replaying the last couple of seconds is the single most repeated action in transcription,
  // and dragging a phone-sized scrubber to do it is where the time goes.
  $('again').onclick = () => {
    // Clear the edit-pause flag FIRST: otherwise the play() below fires the `play` handler, which
    // rewinds another 2s on top of this one and the reviewer silently gets -4s.
    pausedByEdit = false;
    resetPlaybackTraversalBaseline();
    $('player').currentTime = Math.max(0, $('player').currentTime - 2);
    void requestPlayback();
  };

  // ── pause to type, and replay the run-up on resume (R2.3) ──────────────────
  // The Express Scribe / Descript mechanic, and the reason it matters here: a reviewer who reaches for
  // the textarea while audio is still running is trying to do two things at once, and loses the tail of
  // the current playback position. Pausing on focus lets them type in quiet; rewinding 2s on resume
  // again gives back the run-up, which is exactly the ↺2s button's amount, applied automatically at the
  // one moment it is always wanted. Only ever rewinds when THIS pause caused it — a manual pause is the
  // reviewer's own choice of position and must be left exactly where they put it.
  // (`pausedByEdit` is declared with the rest of the page state, above: show() clears it per clip, and a
  // `let` down here would put that reference in a temporal dead zone if show() ever ran earlier.)
  $('text').addEventListener('focus', () => {
    if (!$('player').paused) {
      $('player').pause();
      pausedByEdit = true;
    }
  });
  $('player').addEventListener('play', () => {
    if (!pausedByEdit) return;
    pausedByEdit = false;
    resetPlaybackTraversalBaseline();
    $('player').currentTime = Math.max(0, $('player').currentTime - 2);
  });

  // ── keep the action row and the toast above the on-screen keyboard (R2.4) ──
  // The single worst flow-breaker on the page, and a verified one: on iOS the keyboard does NOT resize
  // the layout viewport, so a reviewer who tapped the transcript to fix a word had Save, Accept and
  // Reject — and the "Saved" toast — hidden underneath it. They typed the correction and then could not
  // see the button that commits it. `interactive-widget=resizes-content` in the viewport meta handles
  // Android declaratively; visualViewport is the iOS half. Both feed the same `--kb` variable, so the
  // CSS has one thing to react to.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    // `nudge` only on RESIZE — the keyboard appearing or disappearing. Self-audit of R2: the scroll
    // listener is here to keep `--kb` accurate, but re-running the nudge from it means a reviewer who
    // deliberately scrolls up to re-read the transcript gets dragged straight back down to the buttons.
    // The page fighting the finger is worse than the problem the nudge solves.
    const applyKb = (nudge) => {
      // What the keyboard covers = the layout viewport minus the visual one, minus how far the visual
      // viewport has been scrolled down inside it. Clamped at 0 so ordinary browser-chrome collapse
      // (which also moves these numbers) can never add phantom padding.
      const covered = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', covered + 'px');
      // Room is only half of it. The padding above makes the page scrollable far enough that the action
      // row CAN clear the keyboard — but the browser scrolls the FOCUSED element into view, and that is
      // the transcript, which sits above the buttons. So the reviewer was left having to notice they
      // could scroll at all. Nudge the row itself, and only while they are actually typing: scrolling
      // the page under someone who is only playing audio would be the tool grabbing the wheel.
      //
      // Computed against the VISUAL viewport, not via scrollIntoView. `scrollIntoView({block:'end'})`
      // aligns to the LAYOUT viewport, and on iOS the layout viewport's bottom edge is the part hidden
      // behind the keyboard — so it lands the row precisely where it cannot be seen, with the padding it
      // needs to clear sitting below it off-screen. Measured here: it left #save at 604px with only the
      // top 400px visible. The overshoot is the honest number, so use it.
      if (nudge && covered > 0 && document.activeElement === $('text')) {
        requestAnimationFrame(() => {
          const overshoot = $('actions').getBoundingClientRect().bottom - (vv.offsetTop + vv.height);
          if (overshoot > 0) window.scrollBy(0, overshoot);
        });
      }
    };
    vv.addEventListener('resize', () => applyKb(true));
    vv.addEventListener('scroll', () => applyKb(false));
    applyKb(false);
  }

  // ── waveform ───────────────────────────────────────────────────────────────
  // Peaks are computed ONCE per clip and cached with it; redraw is then pure canvas work, so seeking
  // and the playback cursor stay smooth on a phone. Decoding is best-effort: a codec the browser
  // cannot decode leaves the strip blank and changes nothing else — the reviewer still has the audio
  // element, the transport row and every button.
  const WAVE_BUCKETS = 160;
  let peaks = null;
  async function drawWave() {
    const c = $('wave');
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(c.clientWidth * dpr));
    const h = Math.max(1, Math.round(c.clientHeight * dpr));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    if (!peaks || !peaks.length) return;
    const style = getComputedStyle(document.documentElement);
    const played = style.getPropertyValue('--accent-line').trim() || '#0284c7';
    const ahead = style.getPropertyValue('--line').trim() || '#334155';
    const dur = $('player').duration;
    const frac = dur && isFinite(dur) ? $('player').currentTime / dur : 0;
    const bw = w / peaks.length;
    for (let i = 0; i < peaks.length; i++) {
      const bh = Math.max(2 * dpr, peaks[i] * h * 0.92);
      ctx.fillStyle = i / peaks.length <= frac ? played : ahead;
      ctx.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - dpr), bh);
    }
  }
  async function loadWave(url) {
    peaks = null;
    void drawWave();
    try {
      const buf = await (await fetch(url)).arrayBuffer();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audio = await new AudioCtx().decodeAudioData(buf);
      const data = audio.getChannelData(0);
      const per = Math.max(1, Math.floor(data.length / WAVE_BUCKETS));
      const out = [];
      // Peak (not mean) per bucket: a mean flattens speech into a uniform smear at this width, which
      // is precisely the silence-vs-speech distinction the strip exists to show.
      for (let i = 0; i < WAVE_BUCKETS; i++) {
        let m = 0;
        for (let j = i * per; j < Math.min((i + 1) * per, data.length); j++) m = Math.max(m, Math.abs(data[j]));
        out.push(m);
      }
      const top = Math.max(...out, 0.01);
      peaks = out.map((v) => v / top); // normalise: a quiet clip must still be readable
      void drawWave();
    } catch { /* undecodable audio simply leaves the strip blank */ }
  }
  $('player').addEventListener('timeupdate', () => void drawWave());
  $('player').addEventListener('loadedmetadata', () => void drawWave());
  $('player').addEventListener('playing', () => clearPlaybackWarning());
  // A clip whose file has moved off disk answers 500 into <audio src>, and nothing surfaced it: the
  // element has no error handler, loadWave swallows the body in a bare catch, and show() hides #warn
  // on every clip. The reviewer saw a normal card with a player that did nothing — and no way past it,
  // because the queue only advances on a DECISION. Both available exits write a verdict they cannot
  // justify: accept promotes an unverified ASR draft to gold, reject permanently excludes a clip that may
  // be fine. Say what happened, and offer the one honest action: move on without judging it.
  $('player').addEventListener('error', () => {
    resetPlaybackTraversalBaseline();
    if (!queue[i]) return;
    // The skip button is always on screen now; this only NAMES the reason the reviewer is stuck, so
    // they do not sit waiting for audio that is never going to arrive.
    showPlaybackWarning('audioMissing');
  });
  // Deliberately writes NOTHING to the corpus — no decision, no verdict, no attribution. It goes to the
  // server all the same (rather than just advancing locally, which is what it used to do): only the
  // server can release the lease, stop handing the clip back on the next refill, and record that a
  // human met this clip and could not call it.
  $('skip').onclick = () => void decide('skip');
  addEventListener('resize', () => void drawWave());
  // Tap to seek — the reason a transcriber wants a waveform at all: jump straight to the word in doubt
  // instead of dragging a scrubber the width of a thumb.
  $('wave').addEventListener('click', (e) => {
    const dur = $('player').duration;
    if (!dur || !isFinite(dur)) return;
    const r = $('wave').getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    resetPlaybackTraversalBaseline();
    $('player').currentTime = Math.min(dur, Math.max(0, x * dur));
    void drawWave();
  });

  // ── keep an ACTIVE reviewer's clip from lapsing under them ─────────────────
  // Well inside the server's TTL, so a slow clip never expires while it is genuinely being worked on.
  // A 409 here means someone else took it — said NOW, while the correction can still be copied,
  // instead of at save time when it is already unsaveable.
  async function renewLease() {
    const seg = queue[i];
    if (!seg || document.hidden) return;
    try {
      await api('/api/renew', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: seg.id }),
      });
    } catch (e) {
      if (e.status === 409) { $('warn').textContent = t('heldByOthers', { n: 1 }); $('warn').hidden = false; }
    }
  }
  setInterval(() => void renewLease(), 4 * 60 * 1000);
  // RETRY HELD WORK ON A CLOCK, because nothing else does. flushOutbox ran on exactly two triggers:
  // the `online` event and load(). Once 429 became a HOLD rather than a drop, that left a gap of my
  // own making — throttling never fires `online` (the phone was never offline), so a rate-limited
  // decision sat in localStorage until the batch happened to drain, up to a whole batch later. Work
  // was not lost (localStorage outlives the page) but "queued" has to mean it actually goes.
  //
  // 30s, not the 4-minute lease heartbeat: the couch limiter refills at 120/min, so a throttle clears
  // in seconds and the reviewer is watching a "not sent yet" counter meanwhile. Costs nothing when the
  // outbox is empty, and unlike renewLease it runs while the page is HIDDEN — a backgrounded phone can
  // still finish sending, which is exactly when a reviewer has walked away believing they were done.
  setInterval(() => { if (readOutbox().length) void flushOutbox(); }, 30 * 1000);
  // Renew the moment the reviewer COMES BACK, not up to four minutes later. Ticks are skipped while
  // the page is hidden — deliberately, so a reviewer who wanders off releases their clips — but that
  // leaves a real gap on a phone, where backgrounding is constant (a call, a notification, the screen
  // locking). Someone who returns at minute 13 of a 15-minute lease would have it lapse under them at
  // 15 while they are actively typing, with the next tick not due until 16; another reviewer can take
  // the clip in that window and their correction comes back 409 at save time. Renewing on return
  // collapses that exposure to nothing, and costs one request per time the page is opened.
  // On `document`, which is where visibilitychange is dispatched — a window-level listener only sees
  // it because the event bubbles, which is a needless dependency for the one event that must not be
  // missed here.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) void renewLease(); });

  // ── keep the screen awake while reviewing (phase 6) ─────────────────────────
  // Listen-and-type means long stretches with no touch, and a phone dims and locks mid-clip — which
  // also pauses audio and (on lock) backgrounds the page. Screen Wake Lock needs a SECURE CONTEXT,
  // so this silently does nothing over plain http:// (LAN/tailnet IP links) and comes alive on the
  // https:// ts.net URL. Feature-detected; a refusal (low battery, unsupported) costs nothing — the
  // page merely behaves as it always did. The OS releases the lock whenever the page hides;
  // re-acquired on return, same shape as the lease renewal above.
  let wakeLock = null;
  async function keepAwake() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    catch { /* denied — dimming is the normal fallback, not an error */ }
  }
  $('player').addEventListener('play', () => void keepAwake());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) void keepAwake(); });
  $('retry').onclick  = () => void load();
  $('save').onclick   = () => decide('edit');
  $('accept').onclick = () => decide('accept');
  $('bad').onclick    = () => decide('bad');
  $('undo').onclick   = async () => {
    if (busy) return; busy = true;
    try {
      const poolUndoTarget = preparePoolUndoTarget();
      const undone = await api('/api/undo', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(poolUndoTarget || {}),
      });
      clearPoolUndoTarget(poolUndoTarget);
      toast(t('undone'));
      await load();
      const pos = queue.findIndex((s) => s.id === undone.id);
      if (pos >= 0) i = pos;
      show();
    } catch { toast(t('undoFailed'), true); } // sticky, and no English server text appended (R3.3)
    finally { busy = false; }
  };
  // ── swipe: accept / reject without reaching for a button ───────────────────
  // Bound to the CARD, not the page, and ignored when the gesture starts on the textarea — a reviewer
  // dragging to place a cursor in their correction must never be read as a verdict. The vertical and
  // distance thresholds keep an ordinary scroll from deciding a clip.
  // Thresholds defined ONCE. The commit distance used to be a bare `90` inside touchend, and the
  // drag feedback below has to agree with it exactly — a tint that appears at a different distance
  // from the one that commits is worse than no tint, because the reviewer would trust it.
  const SWIPE_COMMIT_PX = 90;
  const SWIPE_ABORT_DY = 60;
  let touch = null;
  // Direction is meaning, not screen side: in RTL "forward" is leftward. Accept is the forward gesture
  // in both directions so the muscle memory matches the reading order.
  const isForward = (dx) => (document.documentElement.dir === 'rtl' ? dx < 0 : dx > 0);
  function resetSwipe() {
    $('card').classList.remove('dragging', 'willAccept', 'willReject');
    $('card').style.transform = '';
  }
  $('card').addEventListener('touchstart', (e) => {
    if (e.target.closest('textarea, audio, button')) { touch = null; return; }
    touch = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  }, { passive: true });
  // DIRECT MANIPULATION (R3.5). The gesture was undiscoverable and, worse, gave no warning: a reviewer
  // whose thumb travelled 90px while scrolling cast a verdict with nothing on screen having moved.
  $('card').addEventListener('touchmove', (e) => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x;
    const dy = e.changedTouches[0].clientY - touch.y;
    // Too vertical to be a verdict — it is a scroll. Drop the feedback immediately so the card is not
    // left mid-drag while the page moves under it. touchend applies the same rule and commits nothing.
    if (Math.abs(dy) > SWIPE_ABORT_DY) { resetSwipe(); return; }
    $('card').classList.add('dragging');
    // Damped, not 1:1 in distance: the card trails the finger, which reads as pulling something
    // weighted rather than flinging the clip off the screen.
    $('card').style.transform = 'translateX(' + (dx * 0.35).toFixed(1) + 'px)';
    const past = Math.abs(dx) >= SWIPE_COMMIT_PX;
    $('card').classList.toggle('willAccept', past && isForward(dx));
    $('card').classList.toggle('willReject', past && !isForward(dx));
  }, { passive: true });
  $('card').addEventListener('touchcancel', () => { touch = null; resetSwipe(); }, { passive: true });
  $('card').addEventListener('touchend', (e) => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x;
    const dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    resetSwipe(); // snap back first, whether or not this commits
    if (Math.abs(dx) < SWIPE_COMMIT_PX || Math.abs(dy) > SWIPE_ABORT_DY) return;
    void decide(isForward(dx) ? 'accept' : 'bad');
  }, { passive: true });

  applyLocale();
  applyTransport();
  applyTextSize();
  // Say something BEFORE the first fetch resolves. Both panels start hidden, so on a phone on weak
  // signal — the normal case for this page — the reviewer opened their link to a blank screen for as
  // long as the round trip took, with nothing to distinguish "loading" from "this link is broken".
  $('done').hidden = false;
  $('done').textContent = t('loadingMore');
  load();
</script>
</body>
</html>
