<!doctype html>
<html lang="ckb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e15" />
    <title>Cortex — Kurdish Speech Studio</title>

    <!-- Typography: this is an OFFLINE-FIRST app with a strict CSP (style-src/font-src 'self').
         External font CDNs (fonts.googleapis.com / fonts.gstatic.com) are therefore blocked, and
         a blocked <link> fires a resource 'error' that used to blank the whole UI. We render on the
         system stack declared in app.css (--font-sans/-kurdish/-mono: Segoe UI / system-ui etc.,
         which display Kurdish/Arabic correctly). To restore the designed faces, self-host their
         woff2 under /public and add @font-face rules served from 'self'. -->
    <meta name="referrer" content="no-referrer" />
  </head>
  <body class="bg-app text-default">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
