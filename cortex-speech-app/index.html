<!doctype html>
<html lang="ckb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e15" />
    <title>Cortex — Kurdish Speech Studio</title>

    <!-- Typography: Inter (UI, LTR) · Vazirmatn (Kurdish/RTL) · JetBrains Mono (code).
         Loaded NON-render-blocking: the app paints instantly on a quality system
         stack and swaps to the web fonts once they arrive (and stays usable fully
         offline). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-app text-default">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
