# Test isolation from the ambient environment (2026-09-02).
#
# `ApiKeys::load` overlays the process environment over `secrets.env`, so a shell that exports
# GEMINI_API_KEY or OPENROUTER_API_KEY hands every cargo-launched test binary a live key: the
# `import_flow` tests that assert "no Gemini key in scope" go red, and any cloud path that reached
# the network would do so for real. cargo applies `[env]` to build scripts, `cargo run` and every
# test binary alike (measured 2026-09-02 on a lib test and an integration test), and a BLANK value
# counts as unset in `ApiKeys::load`: it neither overrides nor clears a stored key, so the ambient
# key never reaches a test while every store a test builds keeps working.
#
# Only processes cargo launches are affected: the packaged app is untouched, `cargo run` and the
# `#[ignore]` live tests still read the `secrets.env` store, and only the ENVIRONMENT overlay is
# blanked. This file sits at the repository root because cargo discovers config from the current
# directory upward, and cargo runs here from the root Makefile, from `cortex-speech-app/` (CI) and
# from `src-tauri/`. `scripts/test_credential_loader_policy.py` pins both entries.
[env]
GEMINI_API_KEY = { value = "", force = true }
OPENROUTER_API_KEY = { value = "", force = true }
